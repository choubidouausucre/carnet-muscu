<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="robots" content="noindex, nofollow">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet Charles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Carnet d'entraînement, records et objectifs — méthode Delavier adaptée à la morphologie de Charles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column; each tab = page title, then titled sections of cards; fixed bottom tab bar.
   Plates (IWF colours) code muscle groups and sessions. */
:root {
  --bg: #EDEFF2;
  --surface: #FFFFFF;
  --surface-2: #F4F5F7;
  --sunken: #E1E5EA;
  --ink: #12161C;
  --ink-2: #4A5361;
  --ink-3: #6F7884;
  --line: #E2E5E9;
  --line-strong: #CDD2D8;
  --card-shadow: 0 1px 2px rgba(16, 22, 30, .05), 0 8px 18px -10px rgba(16, 22, 30, .12);
  --accent: #D3263A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE4E7;
  --c-red: #D3263A;
  --c-blue: #2160E8;
  --c-yellow: #DDA000;
  --c-green: #1B9655;
  --c-orange: #E5641A;
  --c-pink: #CF2F86;
  --c-grey: #8E97A3;
  /* Muscles : palette à part, distincte des disques de séance */
  --m-pecs: #7C3AED; --m-abdos: #0D9488; --m-dos: #0284C7; --m-epaules: #B45309; --m-bras: #16A34A; --m-jambes: #475569; --m-cardio: #94A3B8;
  --good: #1B9655;
  --warn: #B98100;
  --bad: #D3263A;
  --shadow: 0 10px 30px rgba(18, 22, 28, .14);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 16px;
  --r-sm: 9px;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F13; --surface: #151A20; --surface-2: #1B2128; --sunken: #0A0C0F;
    --ink: #E8ECF1; --ink-2: #A9B2BE; --ink-3: #7D8691; --line: #242B33; --line-strong: #343D47; --card-shadow: none;
    --accent: #FF4A5C; --accent-ink: #FFFFFF; --accent-soft: #3A141A;
    --c-red: #FF4A5C; --c-blue: #4F88FF; --c-yellow: #F0B71C; --c-green: #2DBD6E; --c-orange: #FF7E33; --c-pink: #FF6BB0; --c-grey: #7D8794;
    --m-pecs: #A78BFA; --m-abdos: #2DD4BF; --m-dos: #38BDF8; --m-epaules: #E8A25B; --m-bras: #4ADE80; --m-jambes: #A3B1C6; --m-cardio: #6B7785;
    --good: #2DBD6E; --warn: #F0B71C; --bad: #FF4A5C;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F13; --surface: #151A20; --surface-2: #1B2128; --sunken: #0A0C0F;
  --ink: #E8ECF1; --ink-2: #A9B2BE; --ink-3: #7D8691; --line: #242B33; --line-strong: #343D47; --card-shadow: none;
  --accent: #FF4A5C; --accent-ink: #FFFFFF; --accent-soft: #3A141A;
  --c-red: #FF4A5C; --c-blue: #4F88FF; --c-yellow: #F0B71C; --c-green: #2DBD6E; --c-orange: #FF7E33; --c-pink: #FF6BB0; --c-grey: #7D8794;
    --m-pecs: #A78BFA; --m-abdos: #2DD4BF; --m-dos: #38BDF8; --m-epaules: #E8A25B; --m-bras: #4ADE80; --m-jambes: #A3B1C6; --m-cardio: #6B7785;
  --good: #2DBD6E; --warn: #F0B71C; --bad: #FF4A5C;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num, .display { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.app {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px);
}

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding-block: 12px 10px;
  background: var(--bg);
}
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand b {
  font-family: var(--f-display); font-weight: 700; font-size: 21px; line-height: 1;
  letter-spacing: .02em; text-transform: uppercase;
}
.brand span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 5px; vertical-align: 1px; }
.sync-dot.ok { background: var(--good); }
.sync-dot.err { background: var(--bad); }

.timer-pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 40px; padding: 0 14px 0 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  font-family: var(--f-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums;
}
.timer-pill.running { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.timer-pill.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  border: 1px solid var(--line-strong); background: var(--surface); padding: 0; flex: none;
}
.icon-btn.quiet { border-color: transparent; background: transparent; color: var(--ink-3); }
.icon-btn svg, .timer-pill svg { width: 20px; height: 20px; }

/* Bottom tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs-inner { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); height: var(--tabbar-h); }
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .02em;
}
.tab svg { width: 22px; height: 22px; padding: 4px 14px; box-sizing: content-box; border-radius: 999px; transition: background-color .15s; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--accent); background: var(--accent-soft); }

/* Sections and cards */
.view { display: grid; gap: 22px; }
.section-title {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  margin-top: 6px;
}
.section-title h2 {
  font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .01em; text-transform: uppercase;
}
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; min-width: 0; box-shadow: var(--card-shadow);
}
.card.flat { background: var(--surface-2); box-shadow: none; }
.sheet .card { box-shadow: none; }
/* Titre de page puis sections titrées */
.page-head { display: flex; align-items: flex-end; gap: 12px; padding-top: 2px; }
.page-head h1 { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: .95; letter-spacing: .01em; text-transform: uppercase; }
.page-head p { margin: 5px 0 0; font-size: 14px; color: var(--ink-3); }
.page-head .link { padding-bottom: 3px; white-space: nowrap; }
.view > .page-head + .seg, .view > .page-head + .chips { margin-top: -8px; }
.sec { display: grid; gap: 10px; min-width: 0; }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; }
.sec-h h2 { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .03em; text-transform: uppercase; }
.sec-h .count { font-family: var(--f-body); font-size: 13px; font-weight: 700; color: var(--ink-3); margin-left: 4px; letter-spacing: 0; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.num-h { font-family: var(--f-display); font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.num-h small { font-size: 16px; color: var(--ink-3); font-weight: 600; }
.list-card { padding-block: 2px; }
.stack-xs { display: grid; gap: 3px; }
.card .btn:not(.primary):not(.dark):not(.ghost):not(.danger-fill) { background: var(--surface-2); border-color: transparent; }
.card h3 { font-size: 16px; font-weight: 700; }
.stack { display: grid; gap: 10px; }
.stack-sm { display: grid; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.divider { height: 1px; background: var(--line); margin: 4px 0; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 15px;
}
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.danger { color: var(--bad); }
.btn.danger-fill { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn:disabled { opacity: .45; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; }

/* Segmented and chips */
.seg { display: flex; gap: 4px; padding: 4px; background: var(--sunken); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 1 0 auto; border: 0; background: none; border-radius: 9px; padding: 8px 12px;
  font-weight: 600; font-size: 13.5px; color: var(--ink-2); white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px;
  padding: 7px 12px 7px 9px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
}
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.tag {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px;
  font-size: 12px; font-weight: 600;
  background: var(--sunken); color: var(--ink-2); white-space: nowrap;
}
.tag svg { width: 12px; height: 12px; }
.tag.delavier { background: var(--accent-soft); color: var(--accent); }
.tag.ss { background: color-mix(in srgb, var(--c-green) 14%, transparent); color: var(--c-green); border-color: transparent; }
.tag.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

/* Plates: a weight-plate disc in the IWF colour of the muscle group */
.plate {
  --pc: var(--c-grey);
  width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-block;
  background: radial-gradient(circle, var(--surface) 0 18%, var(--pc) 19% 62%, color-mix(in srgb, var(--pc) 70%, #000) 63% 70%, var(--pc) 71%);
}
.plate.lg { width: 34px; height: 34px; }
.p-red { --pc: var(--c-red); } .p-blue { --pc: var(--c-blue); } .p-yellow { --pc: var(--c-yellow); }
.p-green { --pc: var(--c-green); } .p-orange { --pc: var(--c-orange); } .p-pink { --pc: var(--c-pink); } .p-grey { --pc: var(--c-grey); }

/* Muscles : pastille nommée (mchip), point (mdot), liseré de carte (mbar). Les disques restent pour les séances. */
.m-pecs { --mc: var(--m-pecs); } .m-abdos { --mc: var(--m-abdos); } .m-dos { --mc: var(--m-dos); } .m-epaules { --mc: var(--m-epaules); }
.m-bras { --mc: var(--m-bras); } .m-jambes { --mc: var(--m-jambes); } .m-cardio, .m-autre { --mc: var(--m-cardio); }
.mchip {
  display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px 2px 7px;
  font-size: 12px; font-weight: 700; white-space: nowrap; color: var(--ink);
  background: color-mix(in srgb, var(--mc, var(--c-grey)) 14%, transparent);
  border: 1px solid color-mix(in srgb, var(--mc, var(--c-grey)) 35%, transparent);
}
.mchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--mc, var(--c-grey)); flex: none; }
.mdot { width: 10px; height: 10px; border-radius: 50%; background: var(--mc, var(--c-grey)); flex: none; display: inline-block; }
.mbar { width: 4px; align-self: stretch; min-height: 38px; border-radius: 4px; background: var(--mc, var(--c-grey)); flex: none; }
.eqchip {
  display: inline-flex; align-items: center; border-radius: 6px; padding: 1px 7px; font-size: 11.5px; font-weight: 600;
  color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); white-space: nowrap;
}
.step-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 4px 0 2px; }
.rec-days { display: flex; flex-wrap: wrap; gap: 4px; }
.mlegend { margin: 2px 2px 10px; font-size: 12px; }
.mlegend .muted { color: var(--ink-3); }
.swap-now { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface-2); display: grid; gap: 3px; }
.swap-sec { display: grid; gap: 4px; margin-top: 14px; }
.swap-h { display: flex; gap: 10px; align-items: flex-start; }
.swap-h .hint { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.swap-n {
  width: 22px; height: 22px; border-radius: 50%; flex: none; display: inline-grid; place-items: center;
  font-size: 12px; font-weight: 700; background: var(--ink); color: var(--bg); margin-top: 1px;
}
.swap-li { width: 100%; border: 0; border-bottom: 1px solid var(--line); background: none; color: inherit; text-align: left; font: inherit; cursor: pointer; }
.swap-li:last-child { border-bottom: 0; }
.swap-li > .eqchip { min-width: 64px; justify-content: center; }
.swap-more summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); padding: 8px 0; }

/* Inputs */
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2); font-size: 16px;
}
textarea.input { min-height: 90px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); }
.search .input { padding-left: 38px; }
.check {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: none; padding: 0;
}
.check svg { width: 16px; height: 16px; opacity: 0; }
.check[aria-checked="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.check[aria-checked="true"] svg { opacity: 1; }
.switch { position: relative; width: 46px; height: 28px; flex: none; border-radius: 999px; border: 0; background: var(--sunken); padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .18s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }

/* Home */
.hero {
  position: relative; overflow: hidden; border-radius: 18px; padding: 16px;
  background: var(--ink); color: var(--bg);
}
.hero .eyebrow { color: color-mix(in srgb, var(--bg) 60%, transparent); }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: .95; text-transform: uppercase; margin: 6px 0 4px; }
.hero p { margin: 0; color: color-mix(in srgb, var(--bg) 75%, transparent); font-size: 14px; }
.hero .plate.lg { position: absolute; right: -38px; top: -38px; width: 112px; height: 112px; opacity: .9; }
.hero .eyebrow, .hero h1 { padding-right: 64px; }
.hero .btn:not(.primary) { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.hero .btn.primary { border-color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 2px 8px;
  display: grid; justify-items: center; gap: 4px; font-size: 11px; color: var(--ink-3); font-weight: 600; min-width: 0;
}
.day b { font-family: var(--f-display); font-size: 19px; color: var(--ink); font-weight: 600; line-height: 1; }
.day.today { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.day.done .plate { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--good); }
.day .lbl { font-size: 10px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; max-width: 100%; text-overflow: ellipsis; }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; color: var(--ink-3); margin-left: 2px; }
.stat .k { font-size: 12px; color: var(--ink-3); font-weight: 600; }

/* Barres de progression */
.bar { height: 8px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--ink); }
.bar.over > i { background: var(--warn); }

/* Workout */
.ex { padding: 0; overflow: hidden; }
.ex-head { display: flex; gap: 12px; align-items: flex-start; padding: 15px 14px 12px; }
.ex-head > .plate { margin-top: 2px; }
.ex-head h3 { font-size: 16.5px; line-height: 1.25; }
.ex-presc { font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.ex-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 5px; }
.ex-last { margin: 0 14px 12px; padding: 9px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-variant-numeric: tabular-nums; }
.ex-last .muted { font-weight: 600; margin-right: 4px; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--ink-3); }
.pr-btn {
  display: inline-flex; align-items: baseline; gap: 4px; border: 1px solid var(--line-strong); background: var(--surface);
  border-radius: 999px; padding: 1px 10px; font-size: 12px; font-weight: 700; color: var(--ink-2);
}
.pr-btn b { font-family: var(--f-display); font-size: 17px; color: var(--ink); font-weight: 600; }
.ex.off { opacity: .55; }
.ex .tip { margin: 0 14px 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--accent); }
.ex .tip b { color: var(--ink); }
.sets { display: grid; gap: 0; border-top: 1px solid var(--line); }
.set {
  display: grid; grid-template-columns: 30px 1fr 1fr 44px; gap: 8px; align-items: center;
  padding: 7px 12px 7px 14px; border-bottom: 1px solid var(--line);
}
.set:last-child { border-bottom: 0; }
.set .n { font-family: var(--f-display); font-weight: 600; font-size: 18px; color: var(--ink-3); }
.set .input { min-height: 40px; padding: 6px 10px; text-align: center; font-family: var(--f-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.set .unit { position: relative; }
.set .unit::after { content: attr(data-u); position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink-3); font-weight: 700; pointer-events: none; }
.set.done { background: color-mix(in srgb, var(--good) 9%, transparent); }
.set.done .n { color: var(--good); }
.set-done-btn { width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.set-done-btn svg { width: 20px; height: 20px; }
.set.done .set-done-btn { background: var(--good); color: #fff; border-color: var(--good); }
.set-head { display: grid; grid-template-columns: 30px 1fr 1fr 44px; gap: 8px; padding: 6px 12px 0 14px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-align: center; }
.set-head span:first-child { text-align: left; }
.ex-foot { display: flex; gap: 8px; padding: 0 12px 12px 8px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 12.5px; color: var(--ink-3); }
.hint.up { color: var(--good); font-weight: 600; }
.session-bar {
  position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 15;
  display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px;
  background: var(--ink); color: var(--bg); box-shadow: var(--shadow);
}
.session-bar .stat .v { font-size: 22px; }
.session-bar .stat .k { color: color-mix(in srgb, var(--bg) 60%, transparent); }

/* Lists */
.list { display: grid; }
.li {
  display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0;
}
.li:last-child { border-bottom: 0; }
.li .t { font-weight: 600; font-size: 15px; }
.li .s { font-size: 13px; color: var(--ink-3); }
.li.checked .t { text-decoration: line-through; color: var(--ink-3); }
.qty { font-family: var(--f-display); font-size: 18px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; padding-bottom: 2px; }
.cal .c {
  aspect-ratio: 1 / 1.1; max-width: 100%; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
  display: grid; align-content: space-between; justify-items: center; padding: 5px 2px; font-size: 13px; font-weight: 600; min-width: 0;
}
.cal .c.out { opacity: .35; }
.cal .c.today { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cal .marks { display: flex; gap: 2px; align-items: center; min-height: 12px; }
.cal .marks .plate { width: 12px; height: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: none; }
.chart .avg { fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 4 4; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .goal { stroke: var(--good); stroke-width: 1.4; stroke-dasharray: 6 4; }
.chart .goal-t { fill: var(--good); font-weight: 700; }
.spark { width: 90px; height: 28px; flex: none; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spark circle { fill: var(--accent); }

/* Balance bars */
.bal { display: grid; grid-template-columns: 110px 1fr 46px; gap: 10px; align-items: center; font-size: 13.5px; }
.bal .track { position: relative; height: 14px; border-radius: 6px; background: var(--sunken); overflow: hidden; }
.bal .zone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 22%, transparent); border-left: 1.5px solid var(--good); border-right: 1.5px solid var(--good); }
.bal .fill { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 4px; background: var(--ink-2); }
.bal .fill.prio { background: var(--accent); }
.bal .v { font-family: var(--f-display); font-size: 17px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

/* Knowledge */
.kb-card summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.kb-card summary::-webkit-details-marker { display: none; }
.kb-card summary .chev { margin-left: auto; transition: transform .2s; color: var(--ink-3); width: 18px; height: 18px; flex: none; }
.kb-card[open] summary .chev { transform: rotate(90deg); }
.kb-body { margin-top: 10px; display: grid; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
.kb-body p { margin: 0; }
.kb-body ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.kb-body b { color: var(--ink); }
.kb-src { font-size: 12px; color: var(--ink-3); font-style: italic; }
mark { background: color-mix(in srgb, var(--c-yellow) 40%, transparent); color: inherit; border-radius: 3px; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 13, .45); opacity: 0; transition: opacity .2s; }
.scrim.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  padding-top: 8px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transform: translateY(100%); transition: transform .24s cubic-bezier(.2, .8, .2, 1);
}
.sheet.show { transform: none; }
.sheet-inner { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.grabber { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 2px auto 6px; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { font-family: var(--f-display); font-size: 24px; font-weight: 700; text-transform: uppercase; flex: 1; }

/* Chrono */
.chrono { display: grid; justify-items: center; gap: 14px; padding: 6px 0 4px; }
.chrono svg.ring { width: min(72vw, 270px); height: auto; }
.chrono .ring .track { fill: none; stroke: var(--sunken); stroke-width: 14; }
.chrono .ring .prog { fill: none; stroke: var(--accent); stroke-width: 14; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .25s linear; }
.chrono .ring text { font-family: var(--f-display); font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
.chrono .ring .sub { font-family: var(--f-body); font-size: 11px; font-weight: 700; letter-spacing: .1em; fill: var(--ink-3); }
.chrono.finished .ring .prog { stroke: var(--good); }
.presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* Toast */
.toast {
  position: fixed; left: 50%; z-index: 60; transform: translate(-50%, 20px); opacity: 0;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px);
  background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  box-shadow: var(--shadow); transition: all .22s; max-width: calc(100% - 32px); pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.empty { text-align: center; padding: 22px 10px; color: var(--ink-3); font-size: 14px; }
.notice { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
table.t td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td.n { font-family: var(--f-display); font-size: 17px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

@keyframes pulse { 50% { transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- Barre de repos (en haut, rétrécit, vert → orange → rouge) ---------- */
.top { flex-wrap: wrap; }
.restbar { order: 10; flex-basis: 100%; display: grid; gap: 5px; padding-top: 2px; }
.restbar-row { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; color: var(--ink-2); letter-spacing: .02em; }
.restbar-row .num { font-size: 18px; color: var(--ink); }
.restbar-track { height: 12px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.restbar-fill { height: 100%; width: 100%; border-radius: inherit; background: var(--good); transition: width .25s linear, background-color .4s; }
.restbar.mid .restbar-fill { background: var(--c-orange); }
.restbar.low .restbar-fill { background: var(--bad); }
.restbar.low .restbar-row .num { color: var(--bad); }

/* ---------- Séance écran par écran ---------- */
.step-top { display: flex; align-items: center; gap: 10px; }
.step-top .icon-btn:disabled { opacity: .35; }
.step-prog { height: 6px; border-radius: 99px; background: var(--sunken); overflow: hidden; margin-top: 5px; }
.step-prog i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.step { display: grid; gap: 12px; }
.step-card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px; display: grid; gap: 14px; }
.step-kind { display: inline-flex; align-items: center; border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; background: var(--sunken); color: var(--ink-2); }
.step-kind.warm { background: color-mix(in srgb, var(--c-yellow) 24%, transparent); color: var(--ink); }
.step-kind.side { background: color-mix(in srgb, var(--c-blue) 18%, transparent); color: var(--c-blue); }
.step-kind.ss { background: color-mix(in srgb, var(--c-green) 18%, transparent); color: var(--c-green); }
.step-name { font-family: var(--f-display); font-weight: 700; font-size: 32px; line-height: .98; text-transform: uppercase; }
.step-target { font-size: 15px; font-weight: 600; }
.stepper-wrap { display: grid; gap: 6px; min-width: 0; }
.stepper-lbl { font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.stepper-unit { font-size: 12px; color: var(--ink-3); text-align: center; }
.stepper { display: grid; grid-template-columns: 48px minmax(0, 1fr) 48px; gap: 6px; align-items: center; }
.stepper button { height: 56px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); font-size: 26px; font-weight: 700; padding: 0; }
.stepper .input, .big-input { height: 56px; min-height: 56px; text-align: center; font-family: var(--f-display); font-size: 30px; font-weight: 600; padding: 4px; }
.rir { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rir button { min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 22px; font-weight: 700; display: grid; place-items: center; padding: 4px 0; line-height: 1; }
.rir button small { font-family: var(--f-body); font-size: 10px; font-weight: 600; color: var(--ink-3); margin-top: 3px; }
.rir button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rir button[aria-pressed="true"] small { color: inherit; opacity: .7; }
.cues { margin: 0; padding-left: 18px; display: grid; gap: 5px; font-size: 14px; color: var(--ink-2); }
.big-btn { min-height: 60px; font-size: 18px; border-radius: 16px; }
.rest-screen { text-align: center; display: grid; gap: 14px; padding-top: 6px; }
.rest-time { font-family: var(--f-display); font-size: 104px; font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; }
.next-card { text-align: left; }
.rest-actions { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; }

/* ---------- Sources ---------- */
.srcs { display: inline-flex; flex-wrap: wrap; gap: 5px; vertical-align: middle; }
.src { font-size: 11px; font-weight: 600; color: var(--ink-3); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
a.src:hover { color: var(--accent); border-color: var(--accent); }
.src.delavier { border-style: dashed; }
.src.pratique { font-style: italic; }

/* ---------- Bilan ---------- */
.score-card { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.score-big { font-family: var(--f-display); font-size: 76px; font-weight: 700; line-height: .9; display: flex; align-items: baseline; gap: 2px; }
.score-big small { font-size: 22px; color: var(--ink-3); }
.score-big.good { color: var(--good); } .score-big.warn { color: var(--c-orange); } .score-big.bad { color: var(--bad); }
.part { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; margin-top: 4px; }
.trend { font-weight: 700; } .trend.up { color: var(--good); } .trend.down { color: var(--bad); } .trend.eq { color: var(--ink-3); }
.axe { font-size: 14px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.axe:last-child { border-bottom: 0; }
.pr-card { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- Ressenti de séance ---------- */
.feel-q { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1; text-transform: uppercase; }
.choice { width: 100%; text-align: left; min-height: 54px; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; font-size: 16px; }
.choice[aria-pressed="true"], .rpe-btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.rpe-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.rpe-btn { min-height: 66px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); display: grid; place-content: center; gap: 3px; padding: 6px 2px; }
.rpe-btn b { font-family: var(--f-display); font-size: 26px; line-height: 1; }
.rpe-btn small { font-size: 10px; font-weight: 600; color: var(--ink-3); line-height: 1.1; }
.rpe-btn[aria-pressed="true"] small { color: inherit; opacity: .75; }

.tag.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.alerts { padding-block: 2px; }
.alert-row { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); }
.alert-row:last-child { border-bottom: 0; }
.alert-row p { margin: 0; font-size: 14px; color: var(--ink-2); }
.alert-ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; --tc: var(--accent); color: var(--tc); background: color-mix(in srgb, var(--tc) 14%, transparent); }
.alert-ico svg { width: 18px; height: 18px; }
.alert-ico.blue { --tc: var(--c-blue); } .alert-ico.orange { --tc: var(--c-orange); } .alert-ico.green { --tc: var(--good); }

/* ---------- Calendrier : fait (plein), prévu (cercle), manqué (×) ---------- */
.cal .c.done { background: color-mix(in srgb, var(--pc) 16%, var(--surface)); border-color: color-mix(in srgb, var(--pc) 55%, var(--line)); }
.cal .c.missed { background: var(--surface-2); }
.ring-mark { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--pc); display: inline-block; flex: none; }
.miss-mark { font-size: 12px; line-height: 1; font-weight: 700; color: var(--ink-3); }
.legend-days { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 12px; font-size: 13px; }
.legend-days span { display: inline-flex; align-items: center; gap: 7px; }

/* ---------- Bilan en cercle ---------- */
.report-hero { display: grid; justify-items: center; gap: 6px; text-align: center; }
.score-ring { width: min(92vw, 360px); height: auto; }
.score-ring .bg { fill: none; stroke: var(--sunken); stroke-width: 16; }
.score-ring .fg { fill: none; stroke-width: 16; stroke-linecap: butt; }
.score-ring .fg.good { stroke: var(--good); } .score-ring .fg.warn { stroke: var(--c-orange); } .score-ring .fg.bad { stroke: var(--bad); }
.score-ring text { font-family: var(--f-display); font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
.score-ring .lab { font-family: var(--f-body); font-size: 11px; font-weight: 700; fill: var(--ink-3); letter-spacing: .02em; }
.verdict { font-family: var(--f-display); font-size: 24px; font-weight: 700; text-transform: uppercase; }
.summary { font-size: 16px; line-height: 1.5; margin: 0; }
.keypoints { display: grid; gap: 10px; }
.kp { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; font-size: 14.5px; }
.kp .ico { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.kp .ico.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.kp .ico.warn { background: color-mix(in srgb, var(--c-orange) 18%, transparent); color: var(--c-orange); }
.kp .ico.next { background: color-mix(in srgb, var(--c-blue) 16%, transparent); color: var(--c-blue); }
.mini-ring { width: 46px; height: 46px; flex: none; }
.mini-ring .bg { fill: none; stroke: var(--sunken); stroke-width: 6; }
.mini-ring .fg { fill: none; stroke-width: 6; stroke-linecap: round; }
.mini-ring .fg.good { stroke: var(--good); } .mini-ring .fg.warn { stroke: var(--c-orange); } .mini-ring .fg.bad { stroke: var(--bad); }
.mini-ring text { font-family: var(--f-display); font-weight: 700; font-size: 15px; fill: var(--ink); }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- Accueil : raccourcis, conseil ---------- */
.shortcuts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.shortcuts button {
  display: grid; justify-items: center; gap: 6px; padding: 14px 6px; border-radius: 14px;
  border: 1px solid var(--line); background: var(--surface); box-shadow: var(--card-shadow);
  font-size: 13px; font-weight: 600; color: var(--ink-2);
}
.shortcuts svg { width: 22px; height: 22px; color: var(--accent); }
.tip-card p { font-size: 15.5px; }

/* ---------- Séance : carte du jour ---------- */
.day-card { gap: 12px; }
.day-title { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: .98; text-transform: uppercase; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.facts span { background: var(--surface-2); border-radius: 10px; padding: 6px 10px; font-size: 13px; color: var(--ink-2); }
.facts span.over { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.steps-card { grid-column: 1 / -1; }
.dayrow { display: flex; align-items: center; gap: 10px; font-size: 13.5px; }
.dayrow .tag { white-space: nowrap; }
.facts b { font-family: var(--f-display); font-size: 18px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.day-note { margin: 0; font-size: 14.5px; color: var(--ink-2); }

/* type: 'wr' = charge × reps, 'reps' = répétitions (charge optionnelle), 'time' = temps + distance
   src: 'charles' = ton programme, 'delavier' = ajout/proposition tirée des livres */
function EX(id, name, muscle, sets, reps, type, pr, extra) {
  return Object.assign({ id, name, muscle, sets, reps, type, pr, src: 'charles', enabled: true, perSide: false, tip: '' }, extra || {});

/* Version du programme : à incrémenter quand le programme par défaut change (migration des données déjà enregistrées). */
const PROGRAM_VERSION = 6;

/* Objectif : recomposition jusqu'à 74 kg sec + progression des charges.
   Chaque séance : ~60 min de muscu (chauffe et changements de poste compris) + 20 min de marche inclinée, pour tenir dans 1 h 30.
   v4 : pecs répartis 10 séries lundi / 1 mercredi / 11 vendredi, chaque muscle dans sa zone hebdo, aucune séance au-delà du créneau.
   v5 : moins de fatigue d'un jour à l'autre. Biceps lundi + jeudi (plus jeudi puis vendredi), triceps groupés le vendredi,
        abdos lundi / jeudi / samedi (plus trois jours d'affilée), au moins un jour de pause entre deux séances d'un même muscle.
   v6 : abdos retirés à ta demande (désactivés, pas supprimés). Déroulé optimisé : polyarticulaire avant isolation, exercices à la poulie

   rest = repos conseillé en secondes, inc = palier de progression en kg, minutes/speed = cardio. */
const WALK = (id, minutes, tip) => EX(id, `Marche inclinée · ${minutes} min · inclinaison 12 · 5 km/h`, 'cardio', 1, `${minutes} min`, 'time', null, { minutes, speed: 5, rest: 0, tip: tip || 'Après la muscu, jamais avant : tu gardes ta force pour les charges. Ne tiens pas les barres du tapis, sinon la dépense chute. Environ 250 à 300 kcal pour 30 min à ton poids (estimation).' });

    id: 'split', plate: 'red', title: 'Ton programme : pourquoi ce découpage', tags: 'programme split semaine découpage emploi du temps horaires progression charges force repos décharge marche',
    body: `
<p>Chaque séance = environ 55 min de muscu + 20 à 30 min de marche inclinée, pour tenir dans un créneau de 1 h 30.</p>
<ul>
<li><b>Lundi · Pecs force + épaules + biceps.</b> Pecs frais après le dimanche : c'est là que les charges montent (incliné 4 × 6–8, 3 min de repos). Haut des pecs en priorité, 10 séries de pecs : l'incliné lourd, puis la convergente (un autre développé, avant l'isolation), puis les deux exercices à la poulie à la suite (vis-à-vis, élévations latérales). Enfin 2 séries de curl : les biceps ont ensuite 72 h avant le jeudi.</li>
<li><b>Mardi · Repos</b>. Récupération active : marche dehors si tu veux.</li>
<li><b>Mercredi · Jambes force + rappel pecs.</b> Squat, semi soulevé de terre, puis leg extension et leg curl en superset (quadriceps et ischios, deux muscles opposés), mollets, puis la série de 100 du haut des pecs.</li>
<li><b>Jeudi · Dos + biceps.</b> Dos en entretien une fois par semaine avec des charges lourdes, arrière d'épaule pour la posture. Les lombaires ont travaillé la veille au semi soulevé de terre : buste calé au tirage.</li>
<li><b>Vendredi · Pecs volume + triceps.</b> charges moyennes, sensations, 4 jours après la séance de force. 11 séries de pecs avec les dips, puis les deux extensions triceps et les avant-bras en léger, curl et extension de poignet en superset.</li>
<li><b>Samedi · Jambes volume + fessiers.</b> Remplace le CrossFit : presse, hip thrust, fentes, ischios, adducteurs, mollets assis. 72 h après le squat.</li>
<li><b>Dimanche · Repos.</b></li>
</ul>
<p><b>Récupération :</b> aucun muscle n'est travaillé en direct deux jours de suite. Biceps lundi et jeudi, triceps le vendredi, pecs lundi et vendredi (plus la série de 100 du mercredi), jambes mercredi et samedi. L'onglet Progrès › Équilibre le vérifie à chaque modification de ta semaine.</p>
<p><b>Progression :</b> double progression. Reste sur la même charge tant que toutes les séries n'atteignent pas le haut de la fourchette ; ensuite l'app propose +2,5 kg (haut du corps) ou +5 kg (squat, soulevé de terre, presse, hip thrust). <b>Repos :</b> 3 min sur les gros mouvements, 45 s à 1 min 30 sur l'isolation ; le chrono se règle tout seul.</p>
<p><b>Déroulé de chaque séance :</b> les mouvements lourds et polyarticulaires d'abord, quand tu es frais : c'est sur les exercices faits en premier que la force progresse le plus, alors que la prise de muscle dépend peu de l'ordre. L'isolation vient ensuite, et les exercices au même poste se suivent. <b>Supersets :</b> deux muscles opposés s'enchaînent série par série, 30 s pour changer de poste, puis un repos calculé pour que chaque muscle garde au moins son repos habituel. Tu fais le même nombre de séries en moins de temps. Tu peux en créer d'autres dans Modifier › exercice.</p>
<p><b>Alternance TNT, automatique :</b> la 7e semaine de chaque cycle, l'app divise tes séries par deux en gardant les charges, pour laisser tendons et système nerveux récupérer. Au début du cycle suivant, elle te propose de changer de variante sur un exercice par séance (jamais tes mouvements de référence). Réglable dans Menu › Réglages.</p>`,

    body: `
<ul>
<li><b>Calories :</b> léger surplus, autour de +150 kcal par jour en moyenne, un peu plus les jours d'entraînement. L'app ne suit plus les repas : c'est ta courbe de poids qui dit s'il faut ajuster.</li>
<li><b>Protéines 2,2 g/kg :</b> au-dessus des 1,6–1,7 g/kg retenus par le guide Delavier pour la force, parce que tu cherches aussi à perdre du gras : les protéines protègent le muscle et calent.</li>
<li><b>Ce qui compte :</b> la moyenne de tes pesées (2 à 3 par semaine, le matin à jeun). Le poids monte lentement, autour de +0,5 kg par mois, sans prendre de ventre : c'est du muscle.</li>
<li><b>Ajuster :</b> toutes les 2 semaines, compare ta moyenne de poids à celle d'il y a 2 semaines. Plus de 0,6 kg par mois : mange un peu moins (environ −150 kcal). Poids stable : un peu plus (environ +150 kcal). Il faut 2 pesées par semaine au minimum.</li>

    id: 'pecs', plate: 'red', title: 'Rattrapage des pectoraux', tags: 'pecs pectoraux incliné convergente unilatéral cross-over vis-à-vis haut intérieur floor press ceinture',
    body: `
<ul>
<li><b>Sentir avant de charger.</b> Isolation et machines convergentes d'abord, surtout en unilatéral. Arrête la série à l'<b>échec sensitif</b> (quand tu ne sens plus le pec), pas quand la barre bloque. Avec le temps, les deux échecs se rejoignent.</li>
<li><b>Machine assise &gt; banc allongé</b> quand les omoplates s'effondrent : assis, la gravité tire les épaules vers le bas plutôt que sur les côtés.</li>
<li><b>Unilatéral avec rotation.</b> Tourne buste et genoux de 30 à 45° du côté du bras qui pousse : la convergence augmente, le centre du pec travaille, l'étirement est moins risqué. Démarre léger, en fin de séance.</li>
<li><b>Haut des pecs (ton retard n°1).</b> L'incliné n'est pas automatique : à 40°, l'activation du grand pectoral baisse d'environ 30 % et celle de l'avant d'épaule monte de 75 % (Barnett 1995). C'est surtout une question d'insertion du tendon, pas d'angle de banc. Ce qui marche : la poulie vis-à-vis, poulies basses vers le haut, en <b>unilatéral</b> pour garder l'épaule en arrière ; un incliné plus bas (15–30°) et modéré ; plusieurs stimulations par semaine (lourd le lundi, série de 100 le mercredi, volume le vendredi). Le haut des pecs est aussi le plus exposé aux déchirures à l'incliné lourd : pas d'étirement extrême.</li>
<li><b>Intérieur des pecs.</b> Plus les mains se rapprochent, plus le centre travaille : prise serrée, machine convergente, mains croisées à la poulie. Superset possible : vis-à-vis mains croisées puis développé serré.</li>
<li><b>Fréquence.</b> Les pecs en retard doivent être travaillés souvent : lourd le lundi, une série de 100 au cross-over le mercredi (ni la veille ni le lendemain d'une séance pecs), volume le vendredi.</li>
<li><b>Matériel.</b> Élargis le banc avec 3 à 5 tapis. Le floor press stabilise les omoplates et limite l'amplitude (protège l'attache du pec). Mets la ceinture : elle rigidifie la cage. Une bande en 8 (type « Bowtie ») qui tient les épaules en arrière, une séance sur deux.</li>
<li><b>Avant les pecs</b>, échauffe biceps (prise marteau) et infra-épineux.</li>
</ul>
<p>Si les pecs ne répondent pas après 6 à 8 semaines, passe au cycle complet de rattrapage (fiche « Programmes de référence »).</p>`,

    body: `
<ul>
<li><b>Alternance TNT :</b> alterne séances traumatisantes (lourd, négatives, beaucoup de séries) et non traumatisantes (léger, tension continue, séries longues) pour progresser sans surentraînement.</li>

  nunes2021: { kind: 'etude', short: 'Nunes 2021', label: 'Nunes et al., 2021, Eur J Sport Sci 21(2):149-157 (méta-analyse)', note: 'L\'ordre des exercices a compté pour la force : elle progressait plus sur les exercices faits en début de séance. Pour la prise de muscle, pas de différence selon l\'ordre.', url: 'https://doi.org/10.1080/17461391.2020.1733672' },

  zhang2025: { kind: 'etude', short: 'Zhang 2025', label: 'Zhang, Weakley, Li, Li, García-Ramos, 2025, Sports Med (méta-analyse, 19 études)', note: 'Les supersets raccourcissent la séance sans perte de volume ni de progrès à long terme. Avec deux muscles opposés, on fait même un peu plus de reps ; deux exercices du même muscle obligent à baisser la charge.', url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC12011898/' },
  schoenfeld2016freq: { kind: 'etude', short: 'Schoenfeld 2016 (fréquence)', label: 'Schoenfeld, Ogborn, Krieger, 2016, Sports Med 46(11):1689-1697 (méta-analyse)', note: 'Travailler un muscle au moins 2 fois par semaine a donné un peu plus de croissance qu\'une seule fois ; les volumes n\'étaient pas toujours égaux entre les groupes.', url: 'https://pubmed.ncbi.nlm.nih.gov/27102172/' },
  morannavarro2017: { kind: 'etude', short: 'Morán-Navarro 2017', label: 'Morán-Navarro et al., 2017, Eur J Appl Physiol 117(12):2387-2399', note: 'Dix hommes entraînés, squat et développé couché. Aller à l\'échec à chaque série a ralenti le retour de la force et de la vitesse : récupération nettement plus lente entre 24 et 48 h qu\'en s\'arrêtant à mi-chemin, à volume égal. Petit échantillon.', url: 'https://pubmed.ncbi.nlm.nih.gov/28965198/' },
  belcher2019: { kind: 'etude', short: 'Belcher 2019', label: 'Belcher et al., 2019, Appl Physiol Nutr Metab 44(10):1033-1042', note: 'Douze hommes entraînés, 4 séries à l\'échec à 80 % du max, une semaine squat, une semaine développé couché, une semaine soulevé de terre. Les auteurs n\'ont pas trouvé de récupération plus longue pour le soulevé de terre que pour les deux autres. Petit échantillon.', url: 'https://pubmed.ncbi.nlm.nih.gov/30779596/' },
  pelland2026: { kind: 'etude', short: 'Pelland 2026', label: 'Pelland et al., 2026, Sports Med 56(2):481-505 (méta-régressions, 67 études)', note: 'Plus de séries par semaine = plus de muscle, avec un gain qui ralentit à haut volume. Une fois le volume pris en compte, la fréquence joue surtout sur la force, peu sur le muscle. Les séries où le muscle n\'est qu\'assistant comptent en partie.' },
  iversen2021: { kind: 'etude', short: 'Iversen 2021', label: 'Iversen, Norum, Schoenfeld, Fimland, 2021, Sports Med 51:2079-2095 (revue)', note: 'Pour s\'entraîner en peu de temps : le volume par semaine compte plus que la fréquence, les polyarticulaires d\'abord, les supersets font gagner du temps, et une chauffe ciblée sur l\'exercice suffit.', url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC8449772/' },
  spiering2021: { kind: 'etude', short: 'Spiering 2021', label: 'Spiering, Mujika, Sharp, Foulis, 2021, J Strength Cond Res 35(5):1449-1458 (revue)', note: 'Pour garder un muscle ou sa force, c\'est l\'intensité qui compte : on peut beaucoup réduire la fréquence et le volume si les charges restent lourdes.', url: 'https://pubmed.ncbi.nlm.nih.gov/33629972/' },
  paluch2022: { kind: 'etude', short: 'Paluch 2022', label: 'Paluch et al., 2022, Lancet Public Health 7(3):e219-e228 (méta-analyse, 15 cohortes)', note: 'Plus de pas par jour va avec une mortalité plus basse, jusqu\'à un plateau vers 8 000 à 10 000 pas avant 60 ans (6 000 à 8 000 après).', url: 'https://pubmed.ncbi.nlm.nih.gov/35247352/' },
  rodriguez2020: { kind: 'etude', short: 'Rodríguez-Ridao 2020', label: 'Rodríguez-Ridao et al., 2020, Int J Environ Res Public Health', note: 'Le haut du grand pectoral est le plus actif vers 30° d\'inclinaison ; au-delà de 45°, l\'avant d\'épaule prend le dessus.', url: 'https://pubmed.ncbi.nlm.nih.gov/33049982/' },
  mccrary2015: { kind: 'etude', short: 'McCrary 2015', label: 'McCrary, Ackermann, Halaki, 2015, Br J Sports Med (revue systématique)', note: 'Un échauffement dynamique avec charges améliore la force et la puissance du haut du corps.', url: 'https://pubmed.ncbi.nlm.nih.gov/25694615/' },
  fradkin2010: { kind: 'etude', short: 'Fradkin 2010', label: 'Fradkin, Zazryn, Smoliga, 2010, J Strength Cond Res (méta-analyse)', note: 'S\'échauffer a amélioré la performance dans 79 % des critères étudiés.', url: 'https://pubmed.ncbi.nlm.nih.gov/19996770/' },
  bishop2018: { kind: 'etude', short: 'Bishop 2018', label: 'Bishop, Turner, Read, 2018, J Sports Sci (revue systématique)', note: 'Les écarts de force entre les deux côtés peuvent nuire à la performance ; les preuves restent limitées.', url: 'https://pubmed.ncbi.nlm.nih.gov/28767317/' },
  morton2018: { kind: 'etude', short: 'Morton 2018', label: 'Morton et al., 2018, Br J Sports Med (méta-analyse, 49 essais)', note: 'Les protéines augmentent les gains de masse maigre ; au-delà d\'environ 1,6 g/kg/jour, le bénéfice plafonne en moyenne.', url: 'https://pubmed.ncbi.nlm.nih.gov/28698222/' },
  aragon2018: { kind: 'etude', short: 'Schoenfeld & Aragon 2018', label: 'Schoenfeld & Aragon, 2018, J Int Soc Sports Nutr', note: '20 à 25 g de protéines rapides maximisent la synthèse sur un repas isolé, davantage dans un vrai repas ; viser ~0,4 g/kg sur au moins 4 repas.', url: 'https://pubmed.ncbi.nlm.nih.gov/29497353/' },
  kreider2017: { kind: 'etude', short: 'Kreider 2017', label: 'Kreider et al., 2017, J Int Soc Sports Nutr (position de l\'ISSN)', note: 'La créatine monohydrate est efficace et sûre ; 3 à 5 g par jour en entretien.', url: 'https://doi.org/10.1186/s12970-017-0173-z' },
  schumann2021: { kind: 'etude', short: 'Schumann 2021', label: 'Schumann et al., 2021, Sports Med (méta-analyse)', note: 'Ajouter du cardio à la musculation ne freine pas l\'hypertrophie dans l\'ensemble ; l\'effet se voit surtout sur l\'explosivité.', url: 'https://doi.org/10.1007/s40279-021-01587-7' },
  oikawa2020: { kind: 'etude', short: 'Oikawa 2020', label: 'Oikawa et al., 2020, Am J Clin Nutr 111(3):708-718 (essai randomisé)', note: '30 g de whey deux fois par jour ont stimulé la synthèse musculaire, pas 30 g de collagène, avec ou sans musculation (femmes de 69 ans en moyenne).', url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC7049534/' },
  schoenfeld2018focus: { kind: 'etude', short: 'Schoenfeld 2018', label: 'Schoenfeld et al., 2018, Eur J Sport Sci', note: 'Se concentrer sur le muscle qui travaille a donné plus de croissance des fléchisseurs du coude qu\'un focus externe.', url: 'https://doi.org/10.1080/17461391.2018.1447020' },
  barakat2020: { kind: 'etude', short: 'Barakat 2020', label: 'Barakat et al., 2020, Strength Cond J 42(5)', note: 'Prendre du muscle et perdre du gras en même temps est possible chez des pratiquants entraînés, avec un entraînement progressif et des protéines élevées.', url: 'https://doi.org/10.1519/SSC.0000000000000584' },
  foster2001: { kind: 'etude', short: 'Foster 2001', label: 'Foster et al., 2001, J Strength Cond Res 15(1):109-115', note: 'Méthode de la difficulté de séance : une note sur 10 multipliée par la durée donne une charge d\'entraînement fiable, validée contre la fréquence cardiaque.' },
  haddad2017: { kind: 'etude', short: 'Haddad 2017', label: 'Haddad et al., 2017, Front Neurosci 11:612 (revue)', note: 'La note de difficulté de séance est valide et fiable dans de nombreux sports, musculation comprise.', url: 'https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5673663/' },
  hooper1995: { kind: 'etude', short: 'Hooper 1995', label: 'Hooper et al., 1995, Med Sci Sports Exerc 27(1):106-112', note: 'Des questions simples sur le sommeil, la fatigue, le stress et les courbatures repéraient le surentraînement mieux que les marqueurs sanguins.' },
  saw2016: { kind: 'etude', short: 'Saw 2016', label: 'Saw, Main, Gastin, 2016, Br J Sports Med 50(5):281-291 (revue systématique, 56 études)', note: 'Le ressenti noté par l\'athlète suit les variations de charge d\'entraînement plus finement que les mesures objectives courantes.', url: 'https://pmc.ncbi.nlm.nih.gov/articles/PMC4789708/' },
  knowles2018: { kind: 'etude', short: 'Knowles 2018', label: 'Knowles et al., 2018, J Sci Med Sport 21(9):959-968 (revue systématique)', note: 'Plusieurs nuits trop courtes de suite font baisser la force sur les mouvements polyarticulaires, moins sur les exercices d\'isolation.', url: 'https://pubmed.ncbi.nlm.nih.gov/29422383/' },
  delavier2: { kind: 'delavier', short: 'Méthode Delavier 2', label: 'Delavier & Gundill, La Méthode Delavier de musculation 2 (Vigot)', note: 'Techniques avancées, points faibles, programmes de rattrapage, fiches exercices.' },

  const seg = (key, opts, cur) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" aria-pressed="${v === cur}" data-act="seg" data-key="${key}" data-val="${v}">${esc(l)}</button>`).join('')}</div>`;
  const sw = (on, act, attrs, label) => `<button class="switch" role="switch" aria-checked="${!!on}" data-act="${act}" ${attrs || ''} aria-label="${esc(label || '')}"></button>`;
  function bar(cls, v, max, warnOver) {
    const pct = max ? clamp((v / max) * 100, 0, 100) : 0;
    return `<div class="bar ${cls} ${warnOver && max && v > max * 1.1 ? 'over' : ''}"><i style="width:${pct.toFixed(1)}%"></i></div>`;
  }

  /* ===================== Graphiques ===================== */
  function lineChart(pts, opt) {
    opt = opt || {};
    const W = 640; const H = opt.h || 220; const L = 40; const R = 14; const Tp = 12; const B = 26;
    if (pts.length < 2) return `<div class="empty">${pts.length ? 'Encore un point et la courbe apparaît.' : 'Pas encore de données.'}</div>`;
    const xs = pts.map((p) => parseISO(p.x).getTime());
    const ys = pts.map((p) => p.y).concat(opt.goal != null ? [opt.goal] : []);
    let y0 = Math.min(...ys); let y1 = Math.max(...ys);
    if (y1 - y0 < 2) { y0 -= 1; y1 += 1; }
    const padY = (y1 - y0) * 0.12; y0 -= padY; y1 += padY;
    const x0 = Math.min(...xs); const x1 = Math.max(...xs) || x0 + 1;
    const X = (t) => L + ((t - x0) / Math.max(1, x1 - x0)) * (W - L - R);
    const Y = (v) => Tp + (1 - (v - y0) / (y1 - y0)) * (H - Tp - B);
    const ticks = 4; let grid = '';
    for (let i = 0; i <= ticks; i++) {
      const v = y0 + ((y1 - y0) * i) / ticks; const y = Y(v);
      grid += `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${L - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end">${fmt(v, y1 - y0 < 10 ? 1 : 0)}</text>`;
    }
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
    const area = `${line}L${X(xs[xs.length - 1]).toFixed(1)},${(H - B).toFixed(1)}L${X(xs[0]).toFixed(1)},${(H - B).toFixed(1)}Z`;
    let avg = '';
    if (opt.avg && pts.length > 3) {
      const a = pts.map((p, i) => { const win = pts.filter((q, k) => k <= i && xs[i] - xs[k] < 7 * 864e5); return win.reduce((s, q) => s + q.y, 0) / win.length; });
      avg = `<path class="avg" d="${a.map((v, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(v).toFixed(1)}`).join('')}"/>`;
    }
    const goal = opt.goal != null ? `<line class="goal" x1="${L}" x2="${W - R}" y1="${Y(opt.goal).toFixed(1)}" y2="${Y(opt.goal).toFixed(1)}"/><text class="goal-t" x="${W - R}" y="${(Y(opt.goal) - 5).toFixed(1)}" text-anchor="end">objectif ${fmt(opt.goal, 1)}</text>` : '';
    const lastI = pts.length - 1;
    const xl = (i) => fmtDate(pts[i].x, { day: 'numeric', month: 'short' });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Évolution')}">
      <g class="grid">${grid}</g>${goal}<path class="area" d="${area}"/><path class="line" d="${line}"/>${avg}
      <circle class="dot" cx="${X(xs[lastI]).toFixed(1)}" cy="${Y(pts[lastI].y).toFixed(1)}" r="5"/>
      <text x="${L}" y="${H - 6}">${esc(xl(0))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(xl(lastI))}</text>
    </svg>`;
  }
  function spark(vals) {
    if (vals.length < 2) return '';
    const W = 90; const H = 28; const mn = Math.min(...vals); const mx = Math.max(...vals); const r = mx - mn || 1;
    const p = vals.map((v, i) => `${i ? 'L' : 'M'}${((i / (vals.length - 1)) * (W - 6) + 3).toFixed(1)},${(H - 4 - ((v - mn) / r) * (H - 8)).toFixed(1)}`).join('');
    const lx = W - 3; const ly = H - 4 - ((vals[vals.length - 1] - mn) / r) * (H - 8);
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${p}"/><circle cx="${lx}" cy="${ly.toFixed(1)}" r="2.6"/></svg>`;
  }

  function prBtn(ex) {

  /* ===================== Vue : Progrès ===================== */

  function progBody() {

  function progBalance() {
    const done = doneSetsSince(addDays(today(), -6)); const plan = weeklyPlannedSets(); const freq = weeklyPlannedFreq();

        <span>Pour un muscle en entretien comme ton dos, une seule séance lourde par semaine suffit si les charges restent hautes : c'est l'intensité qui garde le muscle, pas le nombre de séances. Les zones en séries/semaine sont des repères courants en hypertrophie, pas des chiffres des livres.</span>

  /* Jours de travail direct de chaque muscle sur la semaine type : { muscle: { jour: séries } }. */
  function weekMuscleDays() {
    const out = {};
    P().forEach((d) => dayDows(d).forEach((w) => d.exercises.forEach((e) => {
      if (!e.enabled || e.minutes != null || !(e.sets > 0) || !MUSCLES[e.muscle] || !MUSCLES[e.muscle].target) return;
      const m = (out[e.muscle] = out[e.muscle] || {}); m[w] = (m[w] || 0) + e.sets;
    })));
    return out;
  }
  /* Un muscle repris le lendemain n'a qu'environ 24 h pour récupérer : on le signale. */
  function progRecovery() {
    const md = weekMuscleDays(); const order = [1, 2, 3, 4, 5, 6, 0];
    const keys = Object.keys(MUSCLES).filter((k) => md[k]);
    if (!keys.length) return '';
    const back = (k) => order.filter((w) => md[k][w] && md[k][(w + 6) % 7]);
    const rows = keys.map((k) => {
      const b = back(k);
      const chips = order.filter((w) => md[k][w]).map((w) => `<span class="tag ${b.includes(w) ? 'warn' : ''}">${DOW_S[w]} · ${md[k][w]}</span>`).join(' ');
      return `<div class="dayrow">${muscleChip(k)}<span class="grow"></span><span class="rec-days">${chips}</span></div>`;
    }).join('');
    const bad = keys.filter((k) => back(k).length);
    const head = bad.length
      ? `<div class="notice"><b>${bad.map((k) => esc(MUSCLES[k].label)).join(', ')}</b> : travaillé${bad.length > 1 ? 's' : ''} deux jours de suite (en orange). Écarte ces séances d'un jour ou déplace un exercice dans Séance › Modifier.</div>`
      : '<div class="notice">Aucun muscle n\'est travaillé en direct deux jours de suite : il y a toujours au moins un jour de pause entre deux séances d\'un même muscle.</div>';
    return `<section class="card stack-sm"><div class="eyebrow">Récupération · jours de travail direct par muscle</div>${head}${rows}
      <span class="hint">Chiffre = séries prévues ce jour-là. Après des séries menées à l'échec, force et vitesse reviennent nettement plus lentement dans les 24 à 48 h qu'en gardant des reps en réserve : d'où au moins un jour de pause entre deux séances d'un même muscle. Le semi soulevé de terre du mercredi touche aussi les lombaires avant le dos du jeudi ; il ne demande pas plus de récupération qu'un squat, mais garde le buste calé au tirage. ${srcChips(['morannavarro2017', 'belcher2019'])}</span></section>`;
  }
  /* Une ligne par séance : exercices, séries, durée estimée face au créneau, durée réelle moyenne. */
  function progDays() {
    const days = P().filter((d) => (d.dow || []).length && d.exercises.some((e) => e.enabled));
    if (!days.length) return '';
    const rows = days.map((d) => {
      const en = d.exercises.filter((e) => e.enabled); const est = dayMinutes(d); const slot = slotMinutes(d); const real = realMinutes(d.id);
      const nEx = en.filter((e) => e.minutes == null).length; const sets = en.reduce((a, e) => a + (e.minutes == null ? e.sets || 0 : 0), 0);

      return `<div class="dayrow"><span class="plate p-${d.plate}"></span><span class="grow"><b>${esc(DOW_S[dayDows(d)[0]] || '')} · ${esc(shortTitle(d))}</b><br><span class="hint">${nEx} exos · ${sets} séries${en.some((e) => e.minutes != null) ? ' + marche' : ''}${real ? ` · réel ${hm(real.avg)}` : ''}</span></span><span class="tag ${tone}">≈ ${hm(est)}${slot ? ` / ${hm(slot)}` : ''}</span></div>`;
    }).join('');
    return `<section class="card stack-sm"><div class="eyebrow">Durée des séances face au créneau</div>${rows}<span class="hint">Estimation : séries, repos, séries de chauffe et ≈ 1 min par changement de poste, marche comprise. Vise 5 à 8 exercices de muscu et finis avant la fin du créneau ; si une séance déborde, coupe d'abord une isolation, pas un polyarticulaire du début. Un superset (deux muscles opposés enchaînés, option dans Modifier › exercice) fait aussi gagner du temps. ${srcChips(['zhang2025', 'robbins2010'])}</span></section>`;

  function dayDetailSheet(date) {

  /* ===================== Rendu principal ===================== */
  function render() {
    const v = $('#view');
    const fn = { home: renderHome, train: renderTrain, progress: renderProgress }[UI.tab] || renderHome;
    v.innerHTML = fn();
    $$('.tab').forEach((t) => t.setAttribute('aria-current', t.dataset.tab === UI.tab ? 'page' : 'false'));
    $('#topSub').innerHTML = subLine();
    updateTimerUI();
  }
  let pendingRender = false;
  function softRender() {
    const a = document.activeElement;
    if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { pendingRender = true; return; }
    render();
  }
  document.addEventListener('focusout', () => {
    if (!pendingRender) return;
    setTimeout(() => { const a = document.activeElement; if (!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) { pendingRender = false; render(); } }, 60);
  });
  function go(tab, sub) {
    UI.tab = tab;
    if (tab === 'progress' && sub) UI.progressTab = sub;
    if (UI.sheet) closeSheet();
    render(); window.scrollTo(0, 0);
  }
  function applyTheme() {
    const th = S.core.settings.theme;
    if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
    else if (applyTheme.touched) document.documentElement.removeAttribute('data-theme');
    if (th === 'light' || th === 'dark') applyTheme.touched = true;
  }

  /* ===================== Actions ===================== */
  async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove(); toast(ok ? okMsg : 'Copie impossible ici : sélectionne le texte à la main.');
    }
  }
  const backupText = () => JSON.stringify({ app: 'carnet-charles', schema: SCHEMA, exportedAt: new Date().toISOString(), data: S });
  function importData(text) {
    let o = null;
    try { o = JSON.parse(text); } catch (e) { toast('Ce texte n\'est pas une sauvegarde valide.'); return false; }
    const d = o && o.data ? o.data : o;
    if (!d || !d.core || !d.months) { toast('Sauvegarde incomplète : il manque le programme ou l\'historique.'); return false; }
    const months = {}; Object.keys(d.months).forEach((k) => { months[k] = normalizeMonth(d.months[k]); });
    S = { core: normalizeCore(d.core), months };
    persist(['core', ...Object.keys(months).map((k) => 'm:' + k)]);
    applyTheme(); closeSheet(); render(); toast('Sauvegarde restaurée');
    return true;
  }

    moveEx: (el) => {

      if (j < 0 || j >= arr.length) return; arr.splice(i, 1); arr.splice(j, 0, fx.ex); persist(['core']); render();
    },
    editEx: (el) => { UI.confirm = null; exEditorSheet(el.dataset.ex, el.dataset.day); },
    exPerSide: (el) => { el.setAttribute('aria-checked', el.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); },
    exSS: (el) => { el.setAttribute('aria-checked', el.getAttribute('aria-checked') === 'true' ? 'false' : 'true'); },
    saveEx: (el) => {
      const name = $('#exName').value.trim(); if (!name) { toast('Donne un nom à l\'exercice'); return; }
      const data = { name, muscle: $('#exMuscle').value, type: $('#exType').value, sets: clamp(parseInt($('#exSets').value, 10) || 3, 1, 12), reps: $('#exReps').value.trim(), rest: +$('#exRest').value, inc: +$('#exInc').value, perSide: $('[data-act="exPerSide"]').getAttribute('aria-checked') === 'true', ss: $('[data-act="exSS"]').getAttribute('aria-checked') === 'true', note: $('#exNote').value.trim() };

      if (fx) Object.assign(fx.ex, data);
