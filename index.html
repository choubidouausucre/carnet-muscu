<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet Charles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Carnet d'entraînement, repas, courses et objectifs — méthode Delavier adaptée à la morphologie de Charles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky header, fixed bottom tab bar; plates (IWF colours) code muscle groups. */
:root {
  --bg: #ECEEF1;
  --surface: #FFFFFF;
  --surface-2: #F4F5F7;
  --sunken: #E1E5EA;
  --ink: #12161C;
  --ink-2: #4C5562;
  --ink-3: #7A8390;
  --line: #D5DAE0;
  --accent: #D3263A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE4E7;
  --c-red: #D3263A;
  --c-blue: #2160E8;
  --c-yellow: #DDA000;
  --c-green: #1B9655;
  --c-orange: #E5641A;
  --c-grey: #8E97A3;
  --good: #1B9655;
  --warn: #B98100;
  --bad: #D3263A;
  --shadow: 0 10px 30px rgba(18, 22, 28, .14);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --r-sm: 9px;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F13; --surface: #151A20; --surface-2: #1B2128; --sunken: #0A0C0F;
    --ink: #E8ECF1; --ink-2: #A4ADB9; --ink-3: #6E7783; --line: #262D36;
    --accent: #FF4A5C; --accent-ink: #FFFFFF; --accent-soft: #3A141A;
    --c-red: #FF4A5C; --c-blue: #4F88FF; --c-yellow: #F0B71C; --c-green: #2DBD6E; --c-orange: #FF7E33; --c-grey: #7D8794;
    --good: #2DBD6E; --warn: #F0B71C; --bad: #FF4A5C;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F13; --surface: #151A20; --surface-2: #1B2128; --sunken: #0A0C0F;
  --ink: #E8ECF1; --ink-2: #A4ADB9; --ink-3: #6E7783; --line: #262D36;
  --accent: #FF4A5C; --accent-ink: #FFFFFF; --accent-soft: #3A141A;
  --c-red: #FF4A5C; --c-blue: #4F88FF; --c-yellow: #F0B71C; --c-green: #2DBD6E; --c-orange: #FF7E33; --c-grey: #7D8794;
  --good: #2DBD6E; --warn: #F0B71C; --bad: #FF4A5C;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num, .display { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.app {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px);
}

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding-block: 12px 10px;
  background: var(--bg);
}
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand b {
  font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1;
  letter-spacing: .02em; text-transform: uppercase;
}
.brand span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 5px; vertical-align: 1px; }
.sync-dot.ok { background: var(--good); }
.sync-dot.err { background: var(--bad); }

.timer-pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 40px; padding: 0 14px 0 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  font-family: var(--f-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums;
}
.timer-pill.running { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.timer-pill.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); padding: 0; flex: none;
}
.icon-btn svg, .timer-pill svg { width: 20px; height: 20px; }

/* Bottom tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs-inner { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .02em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--accent); }

/* Sections and cards */
.view { display: grid; gap: 14px; }
.section-title {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  margin-top: 6px;
}
.section-title h2 {
  font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .01em; text-transform: uppercase;
}
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px; min-width: 0;
}
.card.flat { background: var(--surface-2); }
.card h3 { font-size: 16px; font-weight: 700; }
.stack { display: grid; gap: 10px; }
.stack-sm { display: grid; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.divider { height: 1px; background: var(--line); margin: 4px 0; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px;
}
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; }

/* Segmented and chips */
.seg { display: flex; gap: 4px; padding: 4px; background: var(--sunken); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 1 0 auto; border: 0; background: none; border-radius: 9px; padding: 8px 12px;
  font-weight: 600; font-size: 13.5px; color: var(--ink-2); white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 12px 7px 9px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
}
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.tag {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 7px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: var(--sunken); color: var(--ink-2); white-space: nowrap;
}
.tag svg { width: 12px; height: 12px; }
.tag.delavier { background: var(--accent-soft); color: var(--accent); }
.tag.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

/* Plates: a weight-plate disc in the IWF colour of the muscle group */
.plate {
  --pc: var(--c-grey);
  width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-block;
  background: radial-gradient(circle, var(--surface) 0 18%, var(--pc) 19% 62%, color-mix(in srgb, var(--pc) 70%, #000) 63% 70%, var(--pc) 71%);
}
.plate.lg { width: 34px; height: 34px; }
.p-red { --pc: var(--c-red); } .p-blue { --pc: var(--c-blue); } .p-yellow { --pc: var(--c-yellow); }
.p-green { --pc: var(--c-green); } .p-orange { --pc: var(--c-orange); } .p-grey { --pc: var(--c-grey); }

/* Inputs */
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2); font-size: 16px;
}
textarea.input { min-height: 90px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); }
.search .input { padding-left: 38px; }
.check {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: none; padding: 0;
}
.check svg { width: 16px; height: 16px; opacity: 0; }
.check[aria-checked="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.check[aria-checked="true"] svg { opacity: 1; }
.switch { position: relative; width: 46px; height: 28px; flex: none; border-radius: 999px; border: 0; background: var(--sunken); padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .18s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }

/* Home */
.hero {
  position: relative; overflow: hidden; border-radius: 18px; padding: 16px;
  background: var(--ink); color: var(--bg);
}
.hero .eyebrow { color: color-mix(in srgb, var(--bg) 60%, transparent); }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: .95; text-transform: uppercase; margin: 6px 0 4px; }
.hero p { margin: 0; color: color-mix(in srgb, var(--bg) 75%, transparent); font-size: 14px; }
.hero .plate.lg { position: absolute; right: -38px; top: -38px; width: 112px; height: 112px; opacity: .9; }
.hero .eyebrow, .hero h1 { padding-right: 64px; }
.hero .btn:not(.primary) { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.hero .btn.primary { border-color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 2px 8px;
  display: grid; justify-items: center; gap: 4px; font-size: 11px; color: var(--ink-3); font-weight: 600; min-width: 0;
}
.day b { font-family: var(--f-display); font-size: 19px; color: var(--ink); font-weight: 600; line-height: 1; }
.day.today { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.day.done .plate { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--good); }
.day .lbl { font-size: 10px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; max-width: 100%; text-overflow: ellipsis; }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; color: var(--ink-3); margin-left: 2px; }
.stat .k { font-size: 12px; color: var(--ink-3); font-weight: 600; }

/* Macro bars */
.macro { display: grid; gap: 6px; }
.macro .top-line { display: flex; justify-content: space-between; font-size: 13px; }
.macro .top-line b { font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--ink); }
.bar.kcal > i { background: var(--accent); }
.bar.p > i { background: var(--c-blue); }
.bar.c > i { background: var(--c-yellow); }
.bar.f > i { background: var(--c-green); }
.bar.over > i { background: var(--warn); }

/* Workout */
.ex { padding: 0; overflow: hidden; }
.ex-head { display: flex; gap: 10px; align-items: flex-start; padding: 13px 14px 10px; }
.ex-head h3 { font-size: 16px; line-height: 1.25; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--ink-3); }
.pr-btn {
  display: inline-flex; align-items: baseline; gap: 4px; border: 1px dashed var(--ink-3); background: transparent;
  border-radius: 8px; padding: 2px 8px; font-size: 12px; font-weight: 700; color: var(--ink-2);
}
.pr-btn b { font-family: var(--f-display); font-size: 17px; color: var(--ink); font-weight: 600; }
.ex.off { opacity: .55; }
.ex .tip { margin: 0 14px 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--accent); }
.ex .tip b { color: var(--ink); }
.sets { display: grid; gap: 0; border-top: 1px solid var(--line); }
.set {
  display: grid; grid-template-columns: 30px 1fr 1fr 44px; gap: 8px; align-items: center;
  padding: 7px 12px 7px 14px; border-bottom: 1px solid var(--line);
}
.set:last-child { border-bottom: 0; }
.set .n { font-family: var(--f-display); font-weight: 600; font-size: 18px; color: var(--ink-3); }
.set .input { min-height: 40px; padding: 6px 10px; text-align: center; font-family: var(--f-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.set .unit { position: relative; }
.set .unit::after { content: attr(data-u); position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink-3); font-weight: 700; pointer-events: none; }
.set.done { background: color-mix(in srgb, var(--good) 9%, transparent); }
.set.done .n { color: var(--good); }
.set-done-btn { width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.set-done-btn svg { width: 20px; height: 20px; }
.set.done .set-done-btn { background: var(--good); color: #fff; border-color: var(--good); }
.set-head { display: grid; grid-template-columns: 30px 1fr 1fr 44px; gap: 8px; padding: 6px 12px 0 14px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-align: center; }
.set-head span:first-child { text-align: left; }
.ex-foot { display: flex; gap: 8px; padding: 8px 12px 12px 14px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 12.5px; color: var(--ink-3); }
.hint.up { color: var(--good); font-weight: 600; }
.session-bar {
  position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 15;
  display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px;
  background: var(--ink); color: var(--bg); box-shadow: var(--shadow);
}
.session-bar .stat .v { font-size: 22px; }
.session-bar .stat .k { color: color-mix(in srgb, var(--bg) 60%, transparent); }

/* Lists */
.list { display: grid; }
.li {
  display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0;
}
.li:last-child { border-bottom: 0; }
.li .t { font-weight: 600; font-size: 15px; }
.li .s { font-size: 13px; color: var(--ink-3); }
.li.checked .t { text-decoration: line-through; color: var(--ink-3); }
.qty { font-family: var(--f-display); font-size: 18px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meal { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.meal:last-child { border-bottom: 0; }
.meal .slot { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.meal .name { font-weight: 600; }
.meal .mac { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.meal button.name-btn { all: unset; cursor: pointer; display: grid; gap: 1px; min-width: 0; }
.meal button.name-btn:focus-visible { outline: 2px solid var(--accent); border-radius: 6px; }
.ingredients { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13.5px; color: var(--ink-2); }
.ingredients li { display: flex; justify-content: space-between; gap: 10px; }

/* Plan grid (meal calendar) */
.plan-day { display: grid; gap: 8px; }
.plan-day .head { display: flex; align-items: center; gap: 8px; }
.plan-day .head b { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; font-weight: 700; }

/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; padding-bottom: 2px; }
.cal .c {
  aspect-ratio: 1 / 1.1; max-width: 100%; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
  display: grid; align-content: space-between; justify-items: center; padding: 5px 2px; font-size: 13px; font-weight: 600; min-width: 0;
}
.cal .c.out { opacity: .35; }
.cal .c.today { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cal .marks { display: flex; gap: 2px; align-items: center; min-height: 12px; }
.cal .marks .plate { width: 12px; height: 12px; }
.cal .meal-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-green); }
.cal .meal-dot.half { background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: color-mix(in srgb, var(--accent) 14%, transparent); stroke: none; }
.chart .avg { fill: none; stroke: var(--ink-2); stroke-width: 1.4; stroke-dasharray: 4 4; }
.chart .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
.chart .goal { stroke: var(--good); stroke-width: 1.4; stroke-dasharray: 6 4; }
.chart .goal-t { fill: var(--good); font-weight: 700; }
.spark { width: 90px; height: 28px; flex: none; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spark circle { fill: var(--accent); }

/* Balance bars */
.bal { display: grid; grid-template-columns: 110px 1fr 46px; gap: 10px; align-items: center; font-size: 13.5px; }
.bal .track { position: relative; height: 14px; border-radius: 6px; background: var(--sunken); overflow: hidden; }
.bal .zone { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 22%, transparent); border-left: 1.5px solid var(--good); border-right: 1.5px solid var(--good); }
.bal .fill { position: absolute; left: 0; top: 3px; bottom: 3px; border-radius: 4px; background: var(--ink-2); }
.bal .fill.prio { background: var(--accent); }
.bal .v { font-family: var(--f-display); font-size: 17px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.kb-card summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.kb-card summary::-webkit-details-marker { display: none; }
.kb-card summary .chev { margin-left: auto; transition: transform .2s; color: var(--ink-3); width: 18px; height: 18px; flex: none; }
.kb-card[open] summary .chev { transform: rotate(90deg); }
.kb-body { margin-top: 10px; display: grid; gap: 10px; font-size: 14.5px; color: var(--ink-2); }
.kb-body p { margin: 0; }
.kb-body ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.kb-body b { color: var(--ink); }
.kb-src { font-size: 12px; color: var(--ink-3); font-style: italic; }
mark { background: color-mix(in srgb, var(--c-yellow) 40%, transparent); color: inherit; border-radius: 3px; }

.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8, 10, 13, .45); opacity: 0; transition: opacity .2s; }
.scrim.show { opacity: 1; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 41;
  max-height: calc(100% - env(safe-area-inset-top, 0px) - 24px); overflow: auto; overscroll-behavior: contain;
  background: var(--surface); border-radius: 22px 22px 0 0; box-shadow: var(--shadow);
  padding-top: 8px;
  padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transform: translateY(100%); transition: transform .24s cubic-bezier(.2, .8, .2, 1);
}
.sheet.show { transform: none; }
.sheet-inner { max-width: 640px; margin: 0 auto; display: grid; gap: 14px; }
.grabber { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 2px auto 6px; }
.sheet-head { display: flex; align-items: center; gap: 10px; }
.sheet-head h2 { font-family: var(--f-display); font-size: 24px; font-weight: 700; text-transform: uppercase; flex: 1; }

/* Chrono */
.chrono { display: grid; justify-items: center; gap: 14px; padding: 6px 0 4px; }
.chrono svg.ring { width: min(72vw, 270px); height: auto; }
.chrono .ring .track { fill: none; stroke: var(--sunken); stroke-width: 14; }
.chrono .ring .prog { fill: none; stroke: var(--accent); stroke-width: 14; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset .25s linear; }
.chrono .ring text { font-family: var(--f-display); font-weight: 700; fill: var(--ink); font-variant-numeric: tabular-nums; }
.chrono .ring .sub { font-family: var(--f-body); font-size: 11px; font-weight: 700; letter-spacing: .1em; fill: var(--ink-3); }
.chrono.finished .ring .prog { stroke: var(--good); }
.presets { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* Toast */
.toast {
  position: fixed; left: 50%; z-index: 60; transform: translate(-50%, 20px); opacity: 0;
  bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px);
  background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-weight: 600; font-size: 14px;
  box-shadow: var(--shadow); transition: all .22s; max-width: calc(100% - 32px); pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.empty { text-align: center; padding: 22px 10px; color: var(--ink-3); font-size: 14px; }
.notice { font-size: 13px; color: var(--ink-2); background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); }
table.t td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t td.n { font-family: var(--f-display); font-size: 17px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

@keyframes pulse { 50% { transform: scale(1.05); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

    body: `

<li><b>Intérieur des pecs.</b> Plus les mains se rapprochent, plus le centre travaille : prise serrée, machine convergente, mains croisées à la poulie. Superset possible : vis-à-vis mains croisées puis développé serré.</li>

    try { const o = JSON.parse(store.get(TIMER_KEY) || 'null'); if (o && (o.state === 'run' || o.state === 'pause')) Object.assign(T, o); else if (o && o.dur) T.dur = o.dur; } catch (e) { /* rien */ }
  })();
  const timerLeft = () => (T.state === 'run' ? Math.max(0, (T.end - Date.now()) / 1000) : T.state === 'pause' ? T.left : T.state === 'done' ? 0 : T.dur);
  function startTimer(sec) {
    T.dur = sec || T.dur || restDefault(); T.end = Date.now() + T.dur * 1000; T.state = 'run';
    audioUnlock(); wake(true); saveTimerState(); updateTimerUI();
  }
  function toggleTimer() {
    if (T.state === 'run') { T.left = timerLeft(); T.state = 'pause'; }
    else if (T.state === 'pause') { T.end = Date.now() + T.left * 1000; T.state = 'run'; audioUnlock(); }
    else { startTimer(T.dur); return; }
    saveTimerState(); updateTimerUI();
  }
  function resetTimer(sec) { T.state = 'idle'; if (sec) T.dur = sec; T.left = T.dur; saveTimerState(); updateTimerUI(); }
  function nudgeTimer(delta) {
    if (T.state === 'run') { T.end += delta * 1000; if (T.end < Date.now()) T.end = Date.now(); }
    else if (T.state === 'pause') T.left = Math.max(0, T.left + delta);
    else { T.dur = clamp(T.dur + delta, 15, 900); T.left = T.dur; }
    saveTimerState(); updateTimerUI();
  }
  function tick() {
    if (T.state === 'run' && Date.now() >= T.end) {
      T.state = 'done'; T.doneAt = Date.now(); saveTimerState(); ring(); toast('Repos terminé : série suivante !');
    }
    if (T.state === 'done' && Date.now() - T.doneAt > 12000) { T.state = 'idle'; T.left = T.dur; saveTimerState(); }
    updateTimerUI();
    if (S.core.active) {
      const t = clock((Date.now() - S.core.active.startedAt) / 1000);
      $$('[data-elapsed]').forEach((el) => { el.textContent = t; });
    }
  }
  function updateTimerUI() {
    const pill = $('#timerPill'); if (!pill) return;
    const left = timerLeft();
    pill.classList.toggle('running', T.state === 'run' || T.state === 'pause');
    pill.classList.toggle('done', T.state === 'done');
    $('#timerPillText').textContent = T.state === 'done' ? 'GO' : clock(left);
    if (UI.sheet === 'chrono') {
      const prog = $('#chronoProg'); const txt = $('#chronoText'); const st = $('#chronoState'); const btn = $('#chronoMain');
      const C = 2 * Math.PI * 104;
      if (prog) prog.style.strokeDashoffset = String(C * (1 - (T.dur ? clamp(left / T.dur, 0, 1) : 0)));
      if (txt) txt.textContent = T.state === 'done' ? 'GO' : clock(left);
      if (st) st.textContent = { idle: 'PRÊT', run: 'REPOS', pause: 'EN PAUSE', done: 'SÉRIE SUIVANTE' }[T.state];
      if (btn) btn.innerHTML = T.state === 'run' ? `${ic('pause')} Pause` : `${ic('play')} ${T.state === 'pause' ? 'Reprendre' : 'Démarrer'}`;
      const wrap = $('#chronoWrap'); if (wrap) wrap.classList.toggle('finished', T.state === 'done');
    }
  }
  let actx = null;
  function audioUnlock() {
    if (!S.core.settings.sound) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      if (!actx) actx = new AC();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function ring() {
    try { if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 300]); } catch (e) { /* pas de vibreur */ }
    if (!S.core.settings.sound || !actx) return;
    try {
      const t0 = actx.currentTime;
      [0, 0.28, 0.56].forEach((dt, i) => {
        const o = actx.createOscillator(); const g = actx.createGain();
        o.type = 'sine'; o.frequency.value = i === 2 ? 1320 : 880;
        g.gain.setValueAtTime(0.0001, t0 + dt);
        g.gain.exponentialRampToValueAtTime(0.4, t0 + dt + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.22);
        o.connect(g); g.connect(actx.destination); o.start(t0 + dt); o.stop(t0 + dt + 0.25);
      });
    } catch (e) { /* audio indisponible */ }
  }
  let wl = null;
  async function wake(on) {

  /* ===================== Graphiques ===================== */
  function lineChart(pts, opt) {
    opt = opt || {};
    const W = 640; const H = opt.h || 220; const L = 40; const R = 14; const Tp = 12; const B = 26;
    if (pts.length < 2) return `<div class="empty">${pts.length ? 'Encore un point et la courbe apparaît.' : 'Pas encore de données.'}</div>`;
    const xs = pts.map((p) => parseISO(p.x).getTime());
    const ys = pts.map((p) => p.y).concat(opt.goal != null ? [opt.goal] : []);
    let y0 = Math.min(...ys); let y1 = Math.max(...ys);
    if (y1 - y0 < 2) { y0 -= 1; y1 += 1; }
    const padY = (y1 - y0) * 0.12; y0 -= padY; y1 += padY;
    const x0 = Math.min(...xs); const x1 = Math.max(...xs) || x0 + 1;
    const X = (t) => L + ((t - x0) / Math.max(1, x1 - x0)) * (W - L - R);
    const Y = (v) => Tp + (1 - (v - y0) / (y1 - y0)) * (H - Tp - B);
    const ticks = 4; let grid = '';
    for (let i = 0; i <= ticks; i++) {
      const v = y0 + ((y1 - y0) * i) / ticks; const y = Y(v);
      grid += `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${L - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end">${fmt(v, y1 - y0 < 10 ? 1 : 0)}</text>`;
    }
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
    const area = `${line}L${X(xs[xs.length - 1]).toFixed(1)},${(H - B).toFixed(1)}L${X(xs[0]).toFixed(1)},${(H - B).toFixed(1)}Z`;
    let avg = '';
    if (opt.avg && pts.length > 3) {
      const a = pts.map((p, i) => { const win = pts.filter((q, k) => k <= i && xs[i] - xs[k] < 7 * 864e5); return win.reduce((s, q) => s + q.y, 0) / win.length; });
      avg = `<path class="avg" d="${a.map((v, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(v).toFixed(1)}`).join('')}"/>`;
    }
    const goal = opt.goal != null ? `<line class="goal" x1="${L}" x2="${W - R}" y1="${Y(opt.goal).toFixed(1)}" y2="${Y(opt.goal).toFixed(1)}"/><text class="goal-t" x="${W - R}" y="${(Y(opt.goal) - 5).toFixed(1)}" text-anchor="end">objectif ${fmt(opt.goal, 1)}</text>` : '';
    const lastI = pts.length - 1;
    const xl = (i) => fmtDate(pts[i].x, { day: 'numeric', month: 'short' });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Évolution')}">
      <g class="grid">${grid}</g>${goal}<path class="area" d="${area}"/><path class="line" d="${line}"/>${avg}
      <circle class="dot" cx="${X(xs[lastI]).toFixed(1)}" cy="${Y(pts[lastI].y).toFixed(1)}" r="5"/>
      <text x="${L}" y="${H - 6}">${esc(xl(0))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(xl(lastI))}</text>
    </svg>`;
  }
  function spark(vals) {
    if (vals.length < 2) return '';
    const W = 90; const H = 28; const mn = Math.min(...vals); const mx = Math.max(...vals); const r = mx - mn || 1;
    const p = vals.map((v, i) => `${i ? 'L' : 'M'}${((i / (vals.length - 1)) * (W - 6) + 3).toFixed(1)},${(H - 4 - ((v - mn) / r) * (H - 8)).toFixed(1)}`).join('');
    const lx = W - 3; const ly = H - 4 - ((vals[vals.length - 1] - mn) / r) * (H - 8);
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${p}"/><circle cx="${lx}" cy="${ly.toFixed(1)}" r="2.6"/></svg>`;
  }

  function prBtn(ex) {
    if (ex.type === 'time') return '';
    return `<button class="pr-btn" data-act="editPR" data-ex="${ex.id}" aria-label="Modifier le PR">PR <b>${ex.pr != null ? fmt(ex.pr, 2) : '—'}</b>${ex.pr != null ? ' kg' : ''}</button>`;
  }
  function exMeta(ex) {
    const reps = ex.type === 'time' ? 'temps / distance' : (ex.reps ? `${ex.reps} reps` : 'reps');
    const rest = S.core.settings.perExerciseRest && ex.rest ? ` · repos ${clock(ex.rest)}` : '';
    return `${ex.sets} × ${esc(reps)}${ex.perSide ? ' par côté' : ''}${ex.setsNote ? ` (${esc(ex.setsNote)})` : ''}${rest}`;
  }
  function progCard(d, ex) {
    const last = lastEntryFor(ex.id); const up = progressionHint(ex); const open = UI.openTips[ex.id];
    const canToggle = ex.src === 'delavier' || UI.editProgram;
    return `<article class="card ex ${ex.enabled ? '' : 'off'}">
      <div class="ex-head"><span class="plate p-${plateOf(ex.muscle)}" title="${esc((MUSCLES[ex.muscle] || {}).label || '')}"></span>
        <div class="grow"><h3>${esc(ex.name)}</h3><div class="ex-meta"><span>${exMeta(ex)}</span>${prBtn(ex)}${ex.src === 'delavier' ? '<span class="tag delavier">Delavier</span>' : ''}${ex.enabled ? '' : '<span class="tag">désactivé</span>'}</div></div>
        ${canToggle ? sw(ex.enabled, 'toggleEx', `data-ex="${ex.id}"`, `Activer ${ex.name}`) : ''}
      </div>
      ${open && ex.tip ? `<div class="tip">${ex.tip}</div>` : ''}
      ${ex.note ? `<div class="tip" style="border-left-color:var(--c-blue)"><b>Note :</b> ${esc(ex.note)}</div>` : ''}
      <div class="ex-foot">
        ${ex.tip ? `<button class="btn sm ghost" data-act="tip" data-ex="${ex.id}">${ic('info')} ${open ? 'Masquer' : 'Conseil'}</button>` : ''}
        ${last ? `<span class="hint">Dernière fois : ${esc(setsSummary(last.entry))}</span>` : ''}
        ${up ? `<span class="hint up">↑ Tente ${fmt(up, 2)} kg</span>` : ''}
        ${UI.editProgram ? `<span class="grow"></span>
          <button class="icon-btn" data-act="moveEx" data-ex="${ex.id}" data-dir="-1" aria-label="Monter">${ic('up')}</button>
          <button class="icon-btn" data-act="moveEx" data-ex="${ex.id}" data-dir="1" aria-label="Descendre">${ic('down')}</button>
          <button class="icon-btn" data-act="editEx" data-ex="${ex.id}" aria-label="Modifier">${ic('edit')}</button>` : ''}
      </div></article>`;
  }
  function renderActive(d, act) {
    const vol = volumeOf(act);
    const confirm = UI.confirm === 'cancelSession';
    return `<section class="stack">
      <div class="row"><span class="plate lg p-${d.plate}"></span><div class="grow"><div class="eyebrow">Séance en cours · ${esc(cap(fmtDate(act.date)))}</div><h2 class="display" style="font-size:30px;text-transform:uppercase;line-height:1">${esc(d.title)}</h2></div></div>
      ${d.warmup ? `<details class="card flat small"><summary><b>Échauffement</b></summary><p style="margin:8px 0 0">${esc(d.warmup)}</p></details>` : ''}
      ${act.entries.map((e, i) => entryCard(e, i)).join('')}
      <div class="field"><label for="sessNote">Notes de séance</label><textarea class="input" id="sessNote" data-in="sessNote" placeholder="Sensations, machine utilisée, exercice de rotation fait…">${esc(act.note || '')}</textarea></div>
      ${confirm ? `<div class="card row wrap"><span class="grow">Abandonner la séance ? Rien ne sera enregistré.</span><button class="btn sm danger" data-act="cancelSession" data-sure="1">Abandonner</button><button class="btn sm" data-act="confirmOff">Continuer</button></div>`
        : `<button class="btn ghost danger" data-act="cancelSession">Abandonner la séance</button>`}
      <div class="session-bar">
        <div class="stat"><span class="v" data-elapsed>${clock((Date.now() - act.startedAt) / 1000)}</span><span class="k">durée</span></div>
        <div class="stat"><span class="v" id="sbSets">${doneSets(act)}/${totalSets(act)}</span><span class="k">séries</span></div>
        <div class="stat grow"><span class="v" id="sbVol">${fmtInt(vol)}<small>kg</small></span><span class="k">volume</span></div>
        <button class="btn primary" data-act="finishAsk">Terminer</button>
      </div>
    </section>`;
  }
  function entryCard(e, ei) {
    const fx = findEx(e.exId); const ex = fx ? fx.ex : e;
    const last = lastEntryFor(e.exId); const up = progressionHint(ex); const open = UI.openTips[e.exId];
    const head = e.type === 'time' ? ['Temps', 'Distance'] : e.type === 'reps' ? ['Reps', 'Lest'] : ['Charge', 'Reps'];
    const rows = e.sets.map((s, si) => setRow(e, ei, s, si, last ? last.entry.sets.filter((x) => x.done)[si] : null, ex)).join('');
    return `<article class="card ex">
      <div class="ex-head"><span class="plate p-${plateOf(e.muscle)}"></span>
        <div class="grow"><h3>${esc(e.name)}</h3><div class="ex-meta"><span>${fx ? exMeta(ex) : `${e.sets.length} séries`}</span>${fx ? prBtn(fx.ex) : ''}</div></div>
        ${ex.tip ? `<button class="icon-btn" data-act="tip" data-ex="${e.exId}" aria-label="Conseil">${ic('info')}</button>` : ''}
      </div>
      ${open && ex.tip ? `<div class="tip">${ex.tip}</div>` : ''}
      ${last || up ? `<div class="ex-foot" style="padding-top:0">${last ? `<span class="hint">Dernière fois (${esc(fmtDate(last.log.date, { day: 'numeric', month: 'short' }))}) : ${esc(setsSummary(last.entry))}</span>` : ''}${up ? `<span class="hint up">↑ Tente ${fmt(up, 2)} kg</span>` : ''}</div>` : ''}
      <div class="set-head"><span>#</span><span>${head[0]}</span><span>${head[1]}</span><span></span></div>
      <div class="sets">${rows}</div>
      <div class="ex-foot"><button class="btn sm" data-act="addSet" data-e="${ei}">${ic('plus')} Série</button>${e.sets.length > 1 ? `<button class="btn sm ghost" data-act="removeSet" data-e="${ei}">${ic('minus')} Série</button>` : ''}</div>
    </article>`;
  }
  function placeholders(e, ls, ex) {
    if (e.type === 'time') return { a: ls && ls.t ? ls.t : (ex.minutes ? `${ex.minutes}:00` : 'mm:ss'), b: ls && ls.d ? String(ls.d) : (ex.minutes && ex.speed ? String(Math.round((ex.speed * 1000 * ex.minutes) / 60)) : 'm') };
    if (e.type === 'reps') return { a: ls && ls.r ? String(ls.r) : (repsMin(ex.reps) ? String(repsMin(ex.reps)) : 'reps'), b: ls && ls.w ? fmt(ls.w, 2) : '0' };
    return { a: ls && ls.w ? fmt(ls.w, 2) : (ex.pr != null ? fmt(ex.pr, 2) : 'kg'), b: ls && ls.r ? String(ls.r) : (repsMin(ex.reps) ? String(repsMin(ex.reps)) : 'reps') };
  }
  function setRow(e, ei, s, si, ls, ex) {
    const ph = placeholders(e, ls, ex);
    const fa = e.type === 'time' ? 't' : e.type === 'reps' ? 'r' : 'w';
    const fb = e.type === 'time' ? 'd' : e.type === 'reps' ? 'w' : 'r';
    const ua = e.type === 'wr' ? 'kg' : ''; const ub = e.type === 'time' ? 'm' : e.type === 'reps' ? 'kg' : '';
    const val = (f) => (s[f] == null ? '' : (f === 'w' ? String(s[f]).replace('.', ',') : String(s[f])));
    const im = (f) => (f === 't' ? 'text' : f === 'w' ? 'decimal' : 'numeric');
    const inp = (f, u, p, lbl) => `<span class="unit" data-u="${u}"><input class="input" id="in-${ei}-${si}-${f}" inputmode="${im(f)}" autocomplete="off" placeholder="${esc(p)}" value="${esc(val(f))}" data-in="set" data-e="${ei}" data-s="${si}" data-f="${f}" aria-label="${lbl} série ${si + 1}"></span>`;
    return `<div class="set ${s.done ? 'done' : ''}">
      <span class="n">${si + 1}</span>
      ${inp(fa, ua, ph.a, e.type === 'time' ? 'Temps' : e.type === 'reps' ? 'Répétitions' : 'Charge')}
      ${inp(fb, ub, ph.b, e.type === 'time' ? 'Distance' : e.type === 'reps' ? 'Lest' : 'Répétitions')}
      <button class="set-done-btn" data-act="setDone" data-e="${ei}" data-s="${si}" aria-label="${s.done ? 'Annuler' : 'Valider'} la série ${si + 1}">${ic('check')}</button>
    </div>`;
  }
  function updateSessionBar() {
    const act = S.core.active; if (!act) return;
    const a = $('#sbSets'); const b = $('#sbVol');
    if (a) a.textContent = `${doneSets(act)}/${totalSets(act)}`;
    if (b) b.innerHTML = `${fmtInt(volumeOf(act))}<small>kg</small>`;
  }
  function startSession(dayId) {
    const d = dayById(dayId); if (!d) return;
    if (S.core.active) { UI.tab = 'train'; UI.trainDay = S.core.active.dayId; render(); toast('Une séance est déjà en cours'); return; }
    const entries = d.exercises.filter((e) => e.enabled).map((ex) => {
      const n = Math.max(1, ex.sets || 1);
      return { exId: ex.id, name: ex.name, muscle: ex.muscle, type: ex.type, sets: Array.from({ length: n }, () => ({ w: null, r: null, t: null, d: null, done: false })) };
    });
    S.core.active = { id: uid(), dayId: d.id, title: d.title, date: today(), startedAt: Date.now(), entries, note: '' };
    persist(['core']);
    UI.tab = 'train'; UI.trainDay = d.id; UI.editProgram = false;
    wake(true); audioUnlock(); render(); window.scrollTo(0, 0);
    toast('Séance démarrée. Bon entraînement !');
  }
  function finishSession() {
    const act = S.core.active; if (!act) return;
    const date = act.date; const m = month(date);
    const entries = act.entries.map((e) => ({
      exId: e.exId, name: e.name, muscle: e.muscle, type: e.type,
      sets: e.sets.filter((s) => s.done).map((s) => ({ w: num(s.w), r: num(s.r), t: s.t || null, d: num(s.d), done: true })),
    })).filter((e) => e.sets.length);
    const newPRs = [];
    entries.forEach((e) => {
      if (e.type !== 'wr') return;
      const fx = findEx(e.exId); if (!fx) return;
      const ws = e.sets.filter((s) => (s.r || 0) > 0).map((s) => s.w || 0);
      const maxW = ws.length ? Math.max(...ws) : 0;
      if (maxW > 0 && maxW > (fx.ex.pr || 0)) {
        const prev = fx.ex.pr; fx.ex.pr = maxW;
        m.prs.push({ date, exId: e.exId, value: maxW, prev: prev == null ? null : prev, src: 'séance' });
        newPRs.push({ name: e.name, value: maxW, prev });
      }
    });
    const log = { id: act.id, date, dayId: act.dayId, title: act.title, startedAt: act.startedAt, endedAt: Date.now(), entries, note: act.note || '' };
    const vol = volumeOf(act); const nSets = doneSets(act);
    if (entries.length) m.logs.push(log);
    S.core.active = null; UI.confirm = null;
    persist(['core', mk(date)]);
    wake(false); render();
    const dur = (log.endedAt - log.startedAt) / 60000;
    openSheet('summary', `${sheetHead('Séance enregistrée')}
      <div class="grid3"><div class="stat"><span class="v">${hm(dur)}</span><span class="k">durée</span></div><div class="stat"><span class="v">${nSets}</span><span class="k">séries</span></div><div class="stat"><span class="v">${fmtInt(vol)}<small>kg</small></span><span class="k">volume</span></div></div>
      ${newPRs.length ? `<div class="card stack-sm"><div class="eyebrow">Nouveaux PR</div>${newPRs.map((p) => `<div class="row between"><span>${esc(p.name)}</span><span class="num" style="font-size:19px;font-weight:600">${p.prev != null ? `${fmt(p.prev, 2)} → ` : ''}${fmt(p.value, 2)} kg</span></div>`).join('')}</div>` : '<p class="muted small" style="margin:0">Pas de nouveau PR aujourd\'hui. La régularité fait le travail.</p>'}
      ${entries.length ? '' : '<div class="notice">Aucune série validée : rien n\'a été enregistré.</div>'}
      <p class="small muted" style="margin:0">Pense au repas post-training : ${esc((dayPlan(date).withR.find((x) => x.slot.id === 'post') || { r: { n: 'protéines + glucides' } }).r.n)}.</p>
      <button class="btn primary block" data-act="closeSheet">Fermer</button>`);
  }

  /* ===================== Vue : Repas ===================== */
  function renderMeals() {
    const tabs = seg('mealsTab', [['day', 'Jour'], ['week', 'Semaine'], ['recipes', 'Recettes']], UI.mealsTab);
    let body = '';
    if (UI.mealsTab === 'day') body = mealsDay();
    else if (UI.mealsTab === 'week') body = mealsWeek();
    else body = mealsRecipes();
    return `<div class="section-title"><h2>Repas</h2><button class="link" data-act="openProfile">Cibles & morphologie ›</button></div>${tabs}${body}`;
  }
  function mealRow(dp, x) {
    const date = dp.date;
    if (!x.r) {
      return `<div class="meal"><span class="check" style="opacity:.35"></span><div><span class="slot">${esc(x.slot.label)}</span><div class="muted small">Aucun repas prévu</div></div><button class="icon-btn" data-act="pickRecipe" data-date="${date}" data-slot="${x.slot.id}" aria-label="Ajouter un repas">${ic('plus')}</button></div>`;
    }
    const eaten = !!dp.j.eaten[x.slot.id];
    return `<div class="meal">
      <button class="check" role="checkbox" aria-checked="${eaten}" data-act="toggleMeal" data-date="${date}" data-slot="${x.slot.id}" aria-label="${esc(x.slot.label)} mangé">${ic('check')}</button>
      <button class="name-btn" data-act="recipeSheet" data-date="${date}" data-slot="${x.slot.id}"><span class="slot">${esc(x.slot.label)} · ${esc(x.slot.time)}${x.swapped ? ' · modifié' : ''}</span><span class="name">${esc(x.r.n)}</span><span class="mac">${fmtInt(x.m.kcal)} kcal · P ${fmtInt(x.m.p)} · G ${fmtInt(x.m.c)} · L ${fmtInt(x.m.f)}</span></button>
      <button class="icon-btn" data-act="pickRecipe" data-date="${date}" data-slot="${x.slot.id}" aria-label="Changer ${esc(x.slot.label)}">${ic('edit')}</button>
    </div>`;
  }
  function mealsDay() {
    const date = UI.mealsDate; const dp = dayPlan(date); const sd = sessionDayFor(date);
    const extras = dp.j.extras.map((e, i) => { const f = FOODS[e.fid]; const m = foodM(e.fid, e.g); return `<div class="li"><div class="grow"><div class="t">${esc(f ? f.n : e.fid)}</div><div class="s">${qtyLabel(e.fid, e.g)} · ${fmtInt(m.kcal)} kcal · P ${fmtInt(m.p)} g</div></div><button class="icon-btn" data-act="removeExtra" data-date="${date}" data-i="${i}" aria-label="Retirer">${ic('trash')}</button></div>`; }).join('');
    return `<section class="row between">
        <button class="icon-btn" data-act="mealsDay" data-d="-1" aria-label="Jour précédent">${ic('left')}</button>
        <div style="text-align:center;min-width:0"><div class="eyebrow">${DAYTYPES[dp.type].label}${sd ? ` · ${esc(sd.title)}` : ''}</div><b>${esc(cap(fmtDate(date)))}</b>${date !== today() ? ` · <button class="link" data-act="mealsToday">aujourd'hui</button>` : ''}</div>
        <button class="icon-btn" data-act="mealsDay" data-d="1" aria-label="Jour suivant">${ic('chev')}</button>
      </section>
      <section class="card stack">${macroBars(dp.eaten, dp.t)}
        <span class="hint">Plan du jour : ${fmtInt(dp.planned.kcal)} kcal · ${fmtInt(dp.planned.p)} g de protéines${S.core.settings.autoPortions ? ` · portions ajustées ×${fmt(dp.factor, 2)} à ta cible` : ''}</span></section>
      <section class="card"><div class="eyebrow">Repas prévus</div>${dp.slots.map((x) => mealRow(dp, x)).join('')}</section>
      <section class="card stack-sm"><div class="row between"><div class="eyebrow">Hors plan</div><button class="btn sm" data-act="foodSheet" data-date="${date}">${ic('plus')} Aliment</button></div>${extras || '<p class="muted small" style="margin:0">Un écart, une collation en plus ? Ajoute-le ici pour garder des macros justes.</p>'}</section>`;
  }
  function mealsWeek() {
    const start = addDays(mondayOf(today()), 7 * UI.mealsWeek);
    let out = `${seg('mealsWeek', [['0', 'Cette semaine'], ['1', 'Semaine prochaine']], String(UI.mealsWeek))}`;
    for (let i = 0; i < 7; i++) {
      const date = addDays(start, i); const dp = dayPlan(date); const sd = sessionDayFor(date);
      const eatenN = dp.withR.filter((x) => dp.j.eaten[x.slot.id]).length;

        <div class="head"><span class="plate p-${sd ? sd.plate : 'grey'}"></span><b>${DOW[dowOf(date)]}</b><span class="muted small">${parseISO(date).getDate()} · ${DAYTYPES[dp.type].label}</span><span class="grow"></span><span class="num" style="font-size:17px;font-weight:600">${fmtInt(dp.planned.kcal)} kcal</span></div>
        ${dp.slots.map((x) => `<div class="li" style="padding:7px 0"><span class="slot eyebrow" style="width:92px;flex:none">${esc(x.slot.label)}</span><button class="name-btn grow" style="all:unset;cursor:pointer;flex:1;min-width:0" data-act="pickRecipe" data-date="${date}" data-slot="${x.slot.id}">${x.r ? `${esc(x.r.n)}${x.swapped ? ' <span class="tag">ce jour</span>' : ''}` : '<span class="muted">—</span>'}</button>${dp.j.eaten[x.slot.id] ? `<span class="tag good">${ic('check')}</span>` : ''}</div>`).join('')}

  /* ===================== Vue : Courses ===================== */
  function renderShop() {
    const { start, items } = shoppingList(UI.shopWeek);
    const sh = S.core.shopping;
    const extra = sh.extra.filter((x) => !x.week || x.week === start);
    const total = items.reduce((a, x) => a + x.cost, 0);
    const left = items.filter((x) => !x.checked).length + extra.filter((x) => !x.checked).length;
    let groups = '';
    sh.stores.forEach((st) => {
      const its = items.filter((x) => x.storeId === st.id).sort((a, b) => RAYONS.indexOf(a.f.rayon) - RAYONS.indexOf(b.f.rayon) || a.f.n.localeCompare(b.f.n));
      const ex = extra.filter((x) => (storeById(x.storeId) || {}).id === st.id);
      if (!its.length && !ex.length) return;
      let rayon = ''; let rows = '';
      its.forEach((x) => {

          <div class="grow"><div class="t">${esc(x.name)} <span class="tag">ajouté</span></div><div class="s">${esc(x.qty || '')}</div></div>
          <button class="icon-btn" data-act="removeExtraShop" data-id="${x.id}" aria-label="Supprimer">${ic('trash')}</button></div>`;
      });

    });
    return `<div class="section-title"><h2>Courses</h2><button class="link" data-act="storesSheet">Mes magasins ›</button></div>
      ${seg('shopWeek', [['0', 'Semaine en cours'], ['1', 'Semaine prochaine']], String(UI.shopWeek))}
      <section class="card stack-sm">
        <div class="row between"><div class="stat"><span class="v">${left}<small>à prendre</small></span><span class="k">Semaine du ${esc(fmtDate(start, { day: 'numeric', month: 'long' }))} · calculée depuis ton plan repas</span></div><div class="stat" style="text-align:right"><span class="v">${fmt(total, 0)}<small>€</small></span><span class="k">budget estimé</span></div></div>
        <div class="row wrap"><button class="btn sm" data-act="copyShop">${ic('copy')} Copier la liste</button><button class="btn sm" data-act="addShopSheet">${ic('plus')} Article</button><button class="btn sm ghost" data-act="uncheckShop">Tout décocher</button></div>
      </section>
      ${groups || '<div class="empty">Ton plan repas est vide pour cette semaine.</div>'}

  /* ===================== Vue : Progrès ===================== */
  function renderProgress() {

  function progGoals() {

  function progBalance() {
    const done = doneSetsSince(addDays(today(), -6)); const plan = weeklyPlannedSets();
    const keys = Object.keys(MUSCLES).filter((k) => MUSCLES[k].target).sort((a, b) => (MUSCLES[b].prio ? 1 : 0) - (MUSCLES[a].prio ? 1 : 0));
    const scale = 24;

      const m = MUSCLES[k]; const v = done[k] || 0; const p = plan[k] || 0;
      const [a, b] = m.target;
      return `<div class="bal"><span>${esc(m.label)}${m.prio ? ' <span class="tag delavier">priorité</span>' : ''}<br><span class="hint">prévu ${p}/sem.</span></span>
        <div class="track"><span class="zone" style="left:${(a / scale) * 100}%;width:${((b - a) / scale) * 100}%"></span><span class="fill ${m.prio ? 'prio' : ''}" style="width:${clamp((v / scale) * 100, 0, 100)}%"></span></div>
        <span class="v">${v}</span></div>`;
    }).join('');
    return `<section class="card stack"><div class="eyebrow">Séries validées sur 7 jours glissants</div>${rows}

  }
  function progCalendar() {
    const [y, mo] = UI.calMonth.split('-').map(Number);
    const first = isoOf(new Date(y, mo - 1, 1));
    const start = mondayOf(first); const t = today();
    let cells = DOW_S.slice(1).concat(DOW_S[0]).map((d) => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = addDays(start, i);
      if (i >= 35 && monthKey(d) !== UI.calMonth) break;
      const logs = logsOn(d); const j = journal(d);
      const dp = (S.months[monthKey(d)] && S.months[monthKey(d)].journal[d]) ? dayPlan(d) : null;
      const eatenN = dp ? dp.withR.filter((x) => j.eaten[x.slot.id]).length : 0;
      const tot = dp ? dp.withR.length : 0;
      const dot = eatenN ? `<span class="meal-dot ${eatenN / tot >= 0.8 ? '' : 'half'}"></span>` : '';
      const plates = logs.map((l) => `<span class="plate p-${(dayById(l.dayId) || { plate: 'grey' }).plate}"></span>`).join('');
      const planned = !logs.length && d >= t && sessionDayFor(d) ? `<span class="plate p-${sessionDayFor(d).plate}" style="opacity:.3"></span>` : '';
      cells += `<button class="c ${monthKey(d) !== UI.calMonth ? 'out' : ''} ${d === t ? 'today' : ''}" data-act="dayDetail" data-date="${d}" aria-label="${esc(fmtDate(d))}"><span>${parseISO(d).getDate()}</span><span class="marks">${plates}${planned}${dot}</span></button>`;
    }
    const monthLogs = allLogs().filter((l) => monthKey(l.date) === UI.calMonth);
    const label = new Date(y, mo - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    return `<section class="card stack">
      <div class="row between"><button class="icon-btn" data-act="calMove" data-d="-1" aria-label="Mois précédent">${ic('left')}</button><b class="display" style="font-size:22px;text-transform:uppercase">${esc(label)}</b><button class="icon-btn" data-act="calMove" data-d="1" aria-label="Mois suivant">${ic('chev')}</button></div>

      <div class="legend"><span><span class="plate p-red"></span>séance faite</span><span><span class="plate p-blue" style="opacity:.3"></span>prévue</span><span><span class="meal-dot" style="width:8px;height:8px;border-radius:50%;background:var(--c-green);display:inline-block"></span>repas ≥ 80 %</span></div>
      <span class="hint">${monthLogs.length} séance${monthLogs.length > 1 ? 's' : ''} ce mois-ci.</span></section>`;
  }

      if (el.dataset.num) { v = num(v); if (v == null && k !== 'bodyFat') return; }
      S.core.profile[k] = typeof v === 'string' ? v.trim() : v;
      if (k === 'age') S.core.profile.ageConfirmed = true;
      persist(['core']);
      const c = $('#profileCalc'); if (c) c.innerHTML = profileCalc();
      if (k === 'age') { const lbl = $('label[for="pfA"]'); if (lbl) lbl.textContent = 'Âge'; }
      setSync(Remote.status); render();
    },
    restSec: (el) => { S.core.settings.restSec = +el.value; if (T.state === 'idle') { T.dur = +el.value; T.left = T.dur; saveTimerState(); } persist(['core']); updateTimerUI(); toast(`Repos par défaut : ${clock(+el.value)}`); },
    goalType: (el) => {
      const t = el.value;
      $('#glExWrap').hidden = t !== 'pr'; $('#glFieldWrap').hidden = t !== 'mesure'; $('#glCurWrap').hidden = t !== 'libre'; $('#glHabitWrap').hidden = t !== 'habit';
      const u = $('#glUnit'); if (t === 'poids' || t === 'pr') u.value = 'kg'; else if (t === 'mesure') u.value = 'cm'; else if (t === 'habit') u.value = 'séances';
    },
    rcFood: (el) => { UI.recipeDraft.items[+el.dataset.i].fid = el.value; renderRecipeEditor(); },
    storeName: (el) => { const s = S.core.shopping.stores.find((x) => x.id === el.dataset.id); if (s) { s.name = el.value.trim() || 'Magasin'; persist(['core']); render(); } },
    storeNote: (el) => { const s = S.core.shopping.stores.find((x) => x.id === el.dataset.id); if (s) { s.note = el.value.trim(); persist(['core']); render(); } },
    itemStore: (el) => { S.core.shopping.storeOf[el.dataset.fid] = el.value; persist(['core']); render(); toast('Magasin mis à jour'); },
    itemPrice: (el) => { const v = num(el.value); if (v == null) delete S.core.shopping.priceOf[el.dataset.fid]; else S.core.shopping.priceOf[el.dataset.fid] = v; persist(['core']); render(); },
    importFile: (el) => {
      const file = el.files && el.files[0]; if (!file) return;
      const rd = new FileReader();
      rd.onload = () => { const box = $('#importBox'); if (box) box.value = String(rd.result || ''); UI.confirm = 'import'; const keep = String(rd.result || ''); backupSheet(); $('#importBox').value = keep; };
      rd.readAsText(file);
    },
  };

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act],[data-tab]');
    if (!t) return;
    if (t.tagName === 'LABEL') return;
    if (t.dataset.tab && !t.dataset.act) { e.preventDefault(); go(t.dataset.tab, t.dataset.sub); return; }
    const fn = ACT[t.dataset.act];
    if (fn) { e.preventDefault(); fn(t, e); }
  });
  document.addEventListener('input', (e) => { const t = e.target; const fn = t.dataset && IN[t.dataset.in]; if (fn) fn(t, e); });
  document.addEventListener('change', (e) => { const t = e.target; const fn = t.dataset && CH[t.dataset.ch]; if (fn) fn(t, e); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && UI.sheet) closeSheet(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (S.core.active || T.state === 'run') wake(true); tick(); }
  });
  document.addEventListener('pointerdown', () => audioUnlock(), { once: true });

  /* ===================== Démarrage ===================== */
  applyTheme();
  render();
  setInterval(tick, 250);
  initRemote();
})();

</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body></html>
