<!doctype html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#ECEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Carnet Charles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Carnet d'entraînement, repas, courses et objectifs — méthode Delavier adaptée à la morphologie de Charles.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, sticky header, fixed bottom tab bar; plates (IWF colours) code muscle groups. */
:root {
  --bg: #ECEEF1;
  --surface: #FFFFFF;
  --surface-2: #F4F5F7;
  --sunken: #E1E5EA;
  --ink: #12161C;
  --ink-2: #4C5562;
  --ink-3: #7A8390;
  --line: #D5DAE0;
  --accent: #D3263A;
  --accent-ink: #FFFFFF;
  --accent-soft: #FBE4E7;
  --c-red: #D3263A;
  --c-blue: #2160E8;
  --c-yellow: #DDA000;
  --c-green: #1B9655;
  --c-orange: #E5641A;
  --c-grey: #8E97A3;
  --good: #1B9655;
  --warn: #B98100;
  --bad: #D3263A;
  --shadow: 0 10px 30px rgba(18, 22, 28, .14);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --r-sm: 9px;
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F13; --surface: #151A20; --surface-2: #1B2128; --sunken: #0A0C0F;
    --ink: #E8ECF1; --ink-2: #A4ADB9; --ink-3: #6E7783; --line: #262D36;
    --accent: #FF4A5C; --accent-ink: #FFFFFF; --accent-soft: #3A141A;
    --c-red: #FF4A5C; --c-blue: #4F88FF; --c-yellow: #F0B71C; --c-green: #2DBD6E; --c-orange: #FF7E33; --c-grey: #7D8794;
    --good: #2DBD6E; --warn: #F0B71C; --bad: #FF4A5C;
    --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F13; --surface: #151A20; --surface-2: #1B2128; --sunken: #0A0C0F;
  --ink: #E8ECF1; --ink-2: #A4ADB9; --ink-3: #6E7783; --line: #262D36;
  --accent: #FF4A5C; --accent-ink: #FFFFFF; --accent-soft: #3A141A;
  --c-red: #FF4A5C; --c-blue: #4F88FF; --c-yellow: #F0B71C; --c-green: #2DBD6E; --c-orange: #FF7E33; --c-grey: #7D8794;
  --good: #2DBD6E; --warn: #F0B71C; --bad: #FF4A5C;
  --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.num, .display { font-family: var(--f-display); font-variant-numeric: tabular-nums; }

.app {
  max-width: 680px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 28px);
}

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding-block: 12px 10px;
  background: var(--bg);
}
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.brand b {
  font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1;
  letter-spacing: .02em; text-transform: uppercase;
}
.brand span { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); margin-right: 5px; vertical-align: 1px; }
.sync-dot.ok { background: var(--good); }
.sync-dot.err { background: var(--bad); }

.timer-pill {
  display: inline-flex; align-items: center; gap: 7px;
  height: 40px; padding: 0 14px 0 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface);
  font-family: var(--f-display); font-weight: 600; font-size: 20px; font-variant-numeric: tabular-nums;
}
.timer-pill.running { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.timer-pill.done { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface); padding: 0; flex: none;
}
.icon-btn svg, .timer-pill svg { width: 20px; height: 20px; }

/* Bottom tabs */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs-inner { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--tabbar-h); }
.tab {
  border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); font-size: 11px; font-weight: 600; letter-spacing: .02em;
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--ink); }
.tab[aria-current="page"] svg { color: var(--accent); }

/* Sections and cards */
.view { display: grid; gap: 14px; }
.section-title {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  margin-top: 6px;
}
.section-title h2 {
  font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .01em; text-transform: uppercase;
}
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  padding: 14px; min-width: 0;
}
.card.flat { background: var(--surface-2); }
.card h3 { font-size: 16px; font-weight: 700; }
.stack { display: grid; gap: 10px; }
.stack-sm { display: grid; gap: 6px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
.divider { height: 1px; background: var(--line); margin: 4px 0; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px;
}
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.block { width: 100%; }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; }

/* Segmented and chips */
.seg { display: flex; gap: 4px; padding: 4px; background: var(--sunken); border-radius: 12px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 1 0 auto; border: 0; background: none; border-radius: 9px; padding: 8px 12px;
  font-weight: 600; font-size: 13.5px; color: var(--ink-2); white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 7px 12px 7px 9px; font-size: 13.5px; font-weight: 600; white-space: nowrap;
}
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.tag {
  display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 2px 7px;
  font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: var(--sunken); color: var(--ink-2); white-space: nowrap;
}
.tag svg { width: 12px; height: 12px; }
.tag.delavier { background: var(--accent-soft); color: var(--accent); }
.tag.good { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); }
.tag.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }

/* Plates: a weight-plate disc in the IWF colour of the muscle group */
.plate {
  --pc: var(--c-grey);
  width: 18px; height: 18px; border-radius: 50%; flex: none; display: inline-block;
  background: radial-gradient(circle, var(--surface) 0 18%, var(--pc) 19% 62%, color-mix(in srgb, var(--pc) 70%, #000) 63% 70%, var(--pc) 71%);
}
.plate.lg { width: 34px; height: 34px; }
.p-red { --pc: var(--c-red); } .p-blue { --pc: var(--c-blue); } .p-yellow { --pc: var(--c-yellow); }
.p-green { --pc: var(--c-green); } .p-orange { --pc: var(--c-orange); } .p-grey { --pc: var(--c-grey); }

/* Inputs */
.field { display: grid; gap: 5px; min-width: 0; }
.field label, .field .lbl { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; text-transform: uppercase; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 9px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface-2); font-size: 16px;
}
textarea.input { min-height: 90px; resize: vertical; }
.input:focus { outline: none; border-color: var(--accent); background: var(--surface); }
.search { position: relative; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); }
.search .input { padding-left: 38px; }
.check {
  width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: none; padding: 0;
}
.check svg { width: 16px; height: 16px; opacity: 0; }
.check[aria-checked="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.check[aria-checked="true"] svg { opacity: 1; }
.switch { position: relative; width: 46px; height: 28px; flex: none; border-radius: 999px; border: 0; background: var(--sunken); padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .18s; }
.switch[aria-checked="true"] { background: var(--good); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }

/* Home */
.hero {
  position: relative; overflow: hidden; border-radius: 18px; padding: 16px;
  background: var(--ink); color: var(--bg);
}
.hero .eyebrow { color: color-mix(in srgb, var(--bg) 60%, transparent); }
.hero h1 { font-family: var(--f-display); font-weight: 700; font-size: 38px; line-height: .95; text-transform: uppercase; margin: 6px 0 4px; }
.hero p { margin: 0; color: color-mix(in srgb, var(--bg) 75%, transparent); font-size: 14px; }
.hero .plate.lg { position: absolute; right: -38px; top: -38px; width: 112px; height: 112px; opacity: .9; }
.hero .eyebrow, .hero h1 { padding-right: 64px; }
.hero .btn:not(.primary) { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); }
.hero .btn.primary { border-color: var(--accent); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day {
  border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 7px 2px 8px;
  display: grid; justify-items: center; gap: 4px; font-size: 11px; color: var(--ink-3); font-weight: 600; min-width: 0;
}
.day b { font-family: var(--f-display); font-size: 19px; color: var(--ink); font-weight: 600; line-height: 1; }
.day.today { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.day.done .plate { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--good); }
.day .lbl { font-size: 10px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; max-width: 100%; text-overflow: ellipsis; }
.stat { display: grid; gap: 2px; min-width: 0; }
.stat .v { font-family: var(--f-display); font-size: 28px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 15px; color: var(--ink-3); margin-left: 2px; }
.stat .k { font-size: 12px; color: var(--ink-3); font-weight: 600; }

/* Macro bars */
.macro { display: grid; gap: 6px; }
.macro .top-line { display: flex; justify-content: space-between; font-size: 13px; }
.macro .top-line b { font-family: var(--f-display); font-size: 17px; font-weight: 600; }
.bar { height: 8px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--ink); }
.bar.kcal > i { background: var(--accent); }
.bar.p > i { background: var(--c-blue); }
.bar.c > i { background: var(--c-yellow); }
.bar.f > i { background: var(--c-green); }
.bar.over > i { background: var(--warn); }

/* Workout */
.ex { padding: 0; overflow: hidden; }
.ex-head { display: flex; gap: 10px; align-items: flex-start; padding: 13px 14px 10px; }
.ex-head h3 { font-size: 16px; line-height: 1.25; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: 4px; font-size: 13px; color: var(--ink-3); }
.pr-btn {
  display: inline-flex; align-items: baseline; gap: 4px; border: 1px dashed var(--ink-3); background: transparent;
  border-radius: 8px; padding: 2px 8px; font-size: 12px; font-weight: 700; color: var(--ink-2);
}
.pr-btn b { font-family: var(--f-display); font-size: 17px; color: var(--ink); font-weight: 600; }
.ex.off { opacity: .55; }
.ex .tip { margin: 0 14px 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13.5px; color: var(--ink-2); border-left: 3px solid var(--accent); }
.ex .tip b { color: var(--ink); }
.sets { display: grid; gap: 0; border-top: 1px solid var(--line); }
.set {
  display: grid; grid-template-columns: 30px 1fr 1fr 44px; gap: 8px; align-items: center;
  padding: 7px 12px 7px 14px; border-bottom: 1px solid var(--line);
}
.set:last-child { border-bottom: 0; }
.set .n { font-family: var(--f-display); font-weight: 600; font-size: 18px; color: var(--ink-3); }
.set .input { min-height: 40px; padding: 6px 10px; text-align: center; font-family: var(--f-display); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.set .unit { position: relative; }
.set .unit::after { content: attr(data-u); position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--ink-3); font-weight: 700; pointer-events: none; }
.set.done { background: color-mix(in srgb, var(--good) 9%, transparent); }
.set.done .n { color: var(--good); }
.set-done-btn { width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; }
.set-done-btn svg { width: 20px; height: 20px; }
.set.done .set-done-btn { background: var(--good); color: #fff; border-color: var(--good); }
.set-head { display: grid; grid-template-columns: 30px 1fr 1fr 44px; gap: 8px; padding: 6px 12px 0 14px; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); text-align: center; }
.set-head span:first-child { text-align: left; }
.ex-foot { display: flex; gap: 8px; padding: 8px 12px 12px 14px; flex-wrap: wrap; align-items: center; }
.hint { font-size: 12.5px; color: var(--ink-3); }
.hint.up { color: var(--good); font-weight: 600; }
.session-bar {
  position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 10px); z-index: 15;
  display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px;
  background: var(--ink); color: var(--bg); box-shadow: var(--shadow);
}
.session-bar .stat .v { font-size: 22px; }
.session-bar .stat .k { color: color-mix(in srgb, var(--bg) 60%, transparent); }

/* Lists */
.list { display: grid; }
.li {
  display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); min-width: 0;
}
.li:last-child { border-bottom: 0; }
.li .t { font-weight: 600; font-size: 15px; }
.li .s { font-size: 13px; color: var(--ink-3); }
.li.checked .t { text-decoration: line-through; color: var(--ink-3); }
.qty { font-family: var(--f-display); font-size: 18px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meal { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); }
.meal:last-child { border-bottom: 0; }
.meal .slot { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.meal .name { font-weight: 600; }
.meal .mac { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.meal button.name-btn { all: unset; cursor: pointer; display: grid; gap: 1px; min-width: 0; }
.meal button.name-btn:focus-visible { outline: 2px solid var(--accent); border-radius: 6px; }
.ingredients { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 13.5px; color: var(--ink-2); }
.ingredients li { display: flex; justify-content: space-between; gap: 10px; }

/* Plan grid (meal calendar) */
.plan-day { display: grid; gap: 8px; }
.plan-day .head { display: flex; align-items: center; gap: 8px; }
.plan-day .head b { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; font-weight: 700; }

/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .dow { text-align: center; font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; padding-bottom: 2px; }
.cal .c {
  aspect-ratio: 1 / 1.1; max-width: 100%; border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
  display: grid; align-content: space-between; justify-items: center; padding: 5px 2px; font-size: 13px; font-weight: 600; min-width: 0;
}
.cal .c.out { opacity: .35; }
.cal .c.today { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.cal .marks { display: flex; gap: 2px; align-items: center; min-height: 12px; }
.cal .marks .plate { width: 12px; height: 12px; }

<li><b>J6 :</b> soulevé de terre, élévations latérales et oiseau, hack squat, mollets. <b>J7 :</b> repos.</li>
</ul>
<p>Ton programme reprend cette logique lourd / moyen / léger (lundi, vendredi, série de 100 le mercredi) sans sacrifier tes deux séances jambes ni le dos. Si les pecs ne répondent pas après 8 semaines, passe 4 à 6 semaines sur le cycle complet ci-dessus.</p>`,
    src: 'Méthode Delavier 2, p. 338–342',
  },

  /* ===================== Graphiques ===================== */
  function lineChart(pts, opt) {
    opt = opt || {};
    const W = 640; const H = opt.h || 220; const L = 40; const R = 14; const Tp = 12; const B = 26;
    if (pts.length < 2) return `<div class="empty">${pts.length ? 'Encore un point et la courbe apparaît.' : 'Pas encore de données.'}</div>`;
    const xs = pts.map((p) => parseISO(p.x).getTime());
    const ys = pts.map((p) => p.y).concat(opt.goal != null ? [opt.goal] : []);
    let y0 = Math.min(...ys); let y1 = Math.max(...ys);
    if (y1 - y0 < 2) { y0 -= 1; y1 += 1; }
    const padY = (y1 - y0) * 0.12; y0 -= padY; y1 += padY;
    const x0 = Math.min(...xs); const x1 = Math.max(...xs) || x0 + 1;
    const X = (t) => L + ((t - x0) / Math.max(1, x1 - x0)) * (W - L - R);
    const Y = (v) => Tp + (1 - (v - y0) / (y1 - y0)) * (H - Tp - B);
    const ticks = 4; let grid = '';
    for (let i = 0; i <= ticks; i++) {
      const v = y0 + ((y1 - y0) * i) / ticks; const y = Y(v);
      grid += `<line x1="${L}" x2="${W - R}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${L - 6}" y="${(y + 4).toFixed(1)}" text-anchor="end">${fmt(v, y1 - y0 < 10 ? 1 : 0)}</text>`;
    }
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
    const area = `${line}L${X(xs[xs.length - 1]).toFixed(1)},${(H - B).toFixed(1)}L${X(xs[0]).toFixed(1)},${(H - B).toFixed(1)}Z`;
    let avg = '';
    if (opt.avg && pts.length > 3) {
      const a = pts.map((p, i) => { const win = pts.filter((q, k) => k <= i && xs[i] - xs[k] < 7 * 864e5); return win.reduce((s, q) => s + q.y, 0) / win.length; });
      avg = `<path class="avg" d="${a.map((v, i) => `${i ? 'L' : 'M'}${X(xs[i]).toFixed(1)},${Y(v).toFixed(1)}`).join('')}"/>`;
    }
    const goal = opt.goal != null ? `<line class="goal" x1="${L}" x2="${W - R}" y1="${Y(opt.goal).toFixed(1)}" y2="${Y(opt.goal).toFixed(1)}"/><text class="goal-t" x="${W - R}" y="${(Y(opt.goal) - 5).toFixed(1)}" text-anchor="end">objectif ${fmt(opt.goal, 1)}</text>` : '';
    const lastI = pts.length - 1;
    const xl = (i) => fmtDate(pts[i].x, { day: 'numeric', month: 'short' });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.label || 'Évolution')}">
      <g class="grid">${grid}</g>${goal}<path class="area" d="${area}"/><path class="line" d="${line}"/>${avg}
      <circle class="dot" cx="${X(xs[lastI]).toFixed(1)}" cy="${Y(pts[lastI].y).toFixed(1)}" r="5"/>
      <text x="${L}" y="${H - 6}">${esc(xl(0))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(xl(lastI))}</text>
    </svg>`;
  }
  function spark(vals) {
    if (vals.length < 2) return '';
    const W = 90; const H = 28; const mn = Math.min(...vals); const mx = Math.max(...vals); const r = mx - mn || 1;
    const p = vals.map((v, i) => `${i ? 'L' : 'M'}${((i / (vals.length - 1)) * (W - 6) + 3).toFixed(1)},${(H - 4 - ((v - mn) / r) * (H - 8)).toFixed(1)}`).join('');
    const lx = W - 3; const ly = H - 4 - ((vals[vals.length - 1] - mn) / r) * (H - 8);
    return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${p}"/><circle cx="${lx}" cy="${ly.toFixed(1)}" r="2.6"/></svg>`;

        ${dp.slots.map((x) => `<div class="li" style="padding:7px 0"><span class="slot eyebrow" style="width:92px;flex:none">${esc(x.slot.label)}</span><button class="name-btn grow" style="all:unset;cursor:pointer;flex:1;min-width:0" data-act="pickRecipe" data-date="${date}" data-slot="${x.slot.id}">${x.r ? `${esc(x.r.n)}${x.swapped ? ' <span class="tag">ce jour</span>' : ''}` : '<span class="muted">—</span>'}</button>${dp.j.eaten[x.slot.id] ? `<span class="tag good">${ic('check')}</span>` : ''}</div>`).join('')}

  /* ===================== Vue : Courses ===================== */
  function renderShop() {
    const { start, items } = shoppingList(UI.shopWeek);
    const sh = S.core.shopping;
    const extra = sh.extra.filter((x) => !x.week || x.week === start);
    const total = items.reduce((a, x) => a + x.cost, 0);
    const left = items.filter((x) => !x.checked).length + extra.filter((x) => !x.checked).length;
    let groups = '';
    sh.stores.forEach((st) => {
      const its = items.filter((x) => x.storeId === st.id).sort((a, b) => RAYONS.indexOf(a.f.rayon) - RAYONS.indexOf(b.f.rayon) || a.f.n.localeCompare(b.f.n));
      const ex = extra.filter((x) => (storeById(x.storeId) || {}).id === st.id);
      if (!its.length && !ex.length) return;
      let rayon = ''; let rows = '';
      its.forEach((x) => {
        if (x.f.rayon !== rayon) { rayon = x.f.rayon; rows += `<div class="eyebrow" style="padding-top:10px">${esc(rayon)}</div>`; }
        rows += `<div class="li ${x.checked ? 'checked' : ''}">
          <button class="check" role="checkbox" aria-checked="${x.checked}" data-act="toggleShop" data-key="${x.key}" aria-label="${esc(x.f.n)}">${ic('check')}</button>
          <button class="grow" style="all:unset;cursor:pointer;flex:1;min-width:0" data-act="shopItem" data-fid="${x.fid}"><div class="t">${esc(x.f.n)}</div><div class="s">${x.packs ? `${x.packs} × ${esc(x.f.pack[1])} · ` : ''}≈ ${fmt(x.cost, 2)} €</div></button>

        rows += `<div class="li ${x.checked ? 'checked' : ''}">

          <div class="grow"><div class="t">${esc(x.name)} <span class="tag">ajouté</span></div><div class="s">${esc(x.qty || '')}</div></div>
          <button class="icon-btn" data-act="removeExtraShop" data-id="${x.id}" aria-label="Supprimer">${ic('trash')}</button></div>`;

        <div class="row between"><div class="stat"><span class="v">${left}<small>à prendre</small></span><span class="k">Semaine du ${esc(fmtDate(start, { day: 'numeric', month: 'long' }))} · calculée depuis ton plan repas</span></div><div class="stat" style="text-align:right"><span class="v">${fmt(total, 0)}<small>€</small></span><span class="k">budget estimé</span></div></div>
        <div class="row wrap"><button class="btn sm" data-act="copyShop">${ic('copy')} Copier la liste</button><button class="btn sm" data-act="addShopSheet">${ic('plus')} Article</button><button class="btn sm ghost" data-act="uncheckShop">Tout décocher</button></div>
      </section>

  /* ===================== Vue : Progrès ===================== */
  function renderProgress() {
    const tabs = seg('progressTab', [['records', 'Records'], ['body', 'Corps'], ['goals', 'Objectifs'], ['balance', 'Équilibre'], ['scores', 'Scores'], ['calendar', 'Calendrier']], UI.progressTab);
    const fn = { records: progRecords, body: progBody, goals: progGoals, balance: progBalance, scores: progScores, calendar: progCalendar }[UI.progressTab] || progRecords;
    return `<div class="section-title"><h2>Progrès</h2></div>${tabs}${fn()}`;
  }
  function progRecords() {
    let out = '';
    P().forEach((d) => {
      const rows = d.exercises.filter((e) => e.type !== 'time').map((ex) => {
        const h = exHistory(ex.id).filter((x) => x.top);
        const best = h.reduce((a, x) => (x.e1 > (a ? a.e1 : 0) ? x : a), null);
        return `<button class="li" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)" data-act="recordSheet" data-ex="${ex.id}">
          <span class="plate p-${plateOf(ex.muscle)}"></span>
          <div class="grow"><div class="t">${esc(ex.name)}</div><div class="s">${best ? `1RM estimé ${fmt(best.e1, 1)} kg · ${h.length} séance${h.length > 1 ? 's' : ''}` : (ex.type === 'reps' ? 'Au poids du corps' : 'Pas encore de séance enregistrée')}</div></div>
          ${spark(h.slice(-10).map((x) => x.top))}
          <span class="qty">${ex.pr != null ? `${fmt(ex.pr, 2)} kg` : '—'}</span></button>`;
      }).join('');
      if (rows) out += `<section class="card"><div class="row"><span class="plate p-${d.plate}"></span><h3>${esc(d.title)}</h3></div>${rows}</section>`;
    });
    return `${out}<p class="hint">Le PR est ta charge de référence : modifie-la à la main, ou elle se met à jour toute seule quand tu valides une série plus lourde.</p>`;
  }
  function progBody() {
    const b = allBody(); const ws = b.filter((x) => x.weight);
    const w = latestWeight(); const goal = S.core.goals.find((g) => g.type === 'poids');
    const first = (f) => { const x = b.find((y) => y[f]); return x ? x[f] : null; };
    const e = energy();
    const meas = MEASURES.map(([f, l]) => { const a = first(f); const z = latestMeasure(f); return `<tr><td>${l}</td><td class="n">${a != null ? fmt(a, 1) : '—'}</td><td class="n">${z != null ? fmt(z, 1) : '—'}</td><td class="n">${a != null && z != null ? `${z - a >= 0 ? '+' : ''}${fmt(z - a, 1)}` : ''}</td></tr>`; }).join('');
    const list = b.slice(-12).reverse().map((x) => `<div class="li"><div class="grow"><div class="t">${esc(cap(fmtDate(x.date, { weekday: 'short', day: 'numeric', month: 'short' })))}</div><div class="s">${[x.weight ? `${fmt(x.weight, 1)} kg` : '', ...MEASURES.filter(([f]) => x[f]).map(([f, l]) => `${l.replace('Tour de ', '').replace('Tour d\'', '')} ${fmt(x[f], 1)} cm`)].filter(Boolean).join(' · ')}</div></div><button class="icon-btn" data-act="bodySheet" data-date="${x.date}" aria-label="Modifier">${ic('edit')}</button></div>`).join('');
    return `<section class="card stack">
        <div class="row between"><div class="stat"><span class="v">${w ? fmt(w, 1) : '—'}<small>kg</small></span><span class="k">Poids actuel · IMC ${w ? fmt(w / ((S.core.profile.heightCm / 100) ** 2), 1) : '—'}</span></div><button class="btn sm primary" data-act="bodySheet">${ic('plus')} Mesure</button></div>
        ${lineChart(ws.map((x) => ({ x: x.date, y: x.weight })), { goal: goal ? goal.target : null, avg: true, label: 'Poids de corps' })}
        <span class="hint">Ligne pointillée : moyenne sur 7 jours. Pèse-toi le matin à jeun, 2 à 3 fois par semaine. Dépense estimée : ${fmtInt(e.tdee)} kcal/j.</span>
      </section>
      <section class="card"><div class="eyebrow">Mensurations (cm)</div><div class="table-wrap"><table class="t"><thead><tr><th>Zone</th><th>Début</th><th>Actuel</th><th>Écart</th></tr></thead><tbody>${meas}</tbody></table></div><p class="hint">Le tour de poitrine est l'indicateur n°1 de ton rattrapage pecs ; mesure-le une fois par mois, bras relâchés.</p></section>
      <section class="card"><div class="eyebrow">Historique</div>${list || '<div class="empty">Aucune mesure.</div>'}</section>`;
  }
  function progGoals() {
    return `${S.core.goals.map((g) => `<section class="card stack-sm"><div class="row between"><span class="eyebrow">${esc({ poids: 'Poids', pr: 'Charge', mesure: 'Mensuration', habit: 'Habitude', libre: 'Libre' }[g.type] || '')}${g.deadline ? ` · avant le ${esc(fmtDate(g.deadline, { day: 'numeric', month: 'long', year: 'numeric' }))}` : ''}</span><button class="icon-btn" data-act="goalSheet" data-id="${g.id}" aria-label="Modifier">${ic('edit')}</button></div>${goalRow(g)}</section>`).join('')}
      <button class="btn block" data-act="goalSheet">${ic('plus')} Nouvel objectif</button>
      <p class="hint">« 74 kg sec » = le poids monte pendant que le tour de taille reste stable. Rythme réaliste : +0,4 à +0,6 kg par mois. Les objectifs « proposé » sont des points de départ, ajuste-les.</p>`;
  }
  function progBalance() {
    const done = doneSetsSince(addDays(today(), -6)); const plan = weeklyPlannedSets();
    const keys = Object.keys(MUSCLES).filter((k) => MUSCLES[k].target).sort((a, b) => (MUSCLES[b].prio ? 1 : 0) - (MUSCLES[a].prio ? 1 : 0));
    const scale = 24;
    const rows = keys.map((k) => {
      const m = MUSCLES[k]; const v = done[k] || 0; const p = plan[k] || 0;
      const [a, b] = m.target;
      return `<div class="bal"><span>${esc(m.label)}${m.prio ? ' <span class="tag delavier">priorité</span>' : ''}<br><span class="hint">prévu ${p}/sem.</span></span>
        <div class="track"><span class="zone" style="left:${(a / scale) * 100}%;width:${((b - a) / scale) * 100}%"></span><span class="fill ${m.prio ? 'prio' : ''}" style="width:${clamp((v / scale) * 100, 0, 100)}%"></span></div>
        <span class="v">${v}</span></div>`;
    }).join('');
    return `<section class="card stack"><div class="eyebrow">Séries validées sur 7 jours glissants</div>${rows}
      <div class="legend"><span><i class="bar" style="width:18px;height:8px;display:inline-block;background:color-mix(in srgb,var(--good) 22%,transparent);border:1.5px solid var(--good)"></i> zone cible hebdo</span><span><i style="width:18px;height:6px;border-radius:3px;display:inline-block;background:var(--accent)"></i> point faible</span></div></section>
      <section class="card flat small stack-sm"><b>Pourquoi ces cibles ?</b><span>Pecs et abdos ont une zone plus haute : ce sont tes points faibles (rattrapage Delavier). Dos et épaules restent en entretien car ils dominent déjà ; s'ils dépassent largement leur zone, ils continuent à voler le travail des pecs. Les cibles en séries/semaine sont des repères d'hypertrophie courants, pas des chiffres tirés des livres.</span></section>`;
  }
  function progCalendar() {
    const [y, mo] = UI.calMonth.split('-').map(Number);
    const first = isoOf(new Date(y, mo - 1, 1));
    const start = mondayOf(first); const t = today();
    let cells = DOW_S.slice(1).concat(DOW_S[0]).map((d) => `<div class="dow">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = addDays(start, i);
      if (i >= 35 && monthKey(d) !== UI.calMonth) break;
      const logs = logsOn(d); const j = journal(d);
      const dp = (S.months[monthKey(d)] && S.months[monthKey(d)].journal[d]) ? dayPlan(d) : null;
      const eatenN = dp ? dp.withR.filter((x) => j.eaten[x.slot.id]).length : 0;
      const tot = dp ? dp.withR.length : 0;
      const dot = eatenN ? `<span class="meal-dot ${eatenN / tot >= 0.8 ? '' : 'half'}"></span>` : '';
      const plates = logs.map((l) => `<span class="plate p-${(dayById(l.dayId) || { plate: 'grey' }).plate}"></span>`).join('');
      const planned = !logs.length && d >= t && sessionDayFor(d) ? `<span class="plate p-${sessionDayFor(d).plate}" style="opacity:.3"></span>` : '';
      cells += `<button class="c ${monthKey(d) !== UI.calMonth ? 'out' : ''} ${d === t ? 'today' : ''}" data-act="dayDetail" data-date="${d}" aria-label="${esc(fmtDate(d))}"><span>${parseISO(d).getDate()}</span><span class="marks">${plates}${planned}${dot}</span></button>`;
    }
    const monthLogs = allLogs().filter((l) => monthKey(l.date) === UI.calMonth);
    const label = new Date(y, mo - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    return `<section class="card stack">
      <div class="row between"><button class="icon-btn" data-act="calMove" data-d="-1" aria-label="Mois précédent">${ic('left')}</button><b class="display" style="font-size:22px;text-transform:uppercase">${esc(label)}</b><button class="icon-btn" data-act="calMove" data-d="1" aria-label="Mois suivant">${ic('chev')}</button></div>
      <div class="cal">${cells}</div>
      <div class="legend"><span><span class="plate p-red"></span>séance faite</span><span><span class="plate p-blue" style="opacity:.3"></span>prévue</span><span><span class="meal-dot" style="width:8px;height:8px;border-radius:50%;background:var(--c-green);display:inline-block"></span>repas ≥ 80 %</span></div>
      <span class="hint">${monthLogs.length} séance${monthLogs.length > 1 ? 's' : ''} ce mois-ci.</span></section>`;
  }

  /* ===================== Feuilles ===================== */

      <div class="chrono" id="chronoWrap">
        <svg class="ring" viewBox="0 0 240 240" aria-hidden="true"><circle class="track" cx="120" cy="120" r="104"/><circle class="prog" id="chronoProg" cx="120" cy="120" r="104" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="0"/>
        <text id="chronoText" x="120" y="132" text-anchor="middle" font-size="64">3:00</text><text class="sub" id="chronoState" x="120" y="162" text-anchor="middle">PRÊT</text></svg>
        <div class="row" style="gap:8px"><button class="btn" data-act="tNudge" data-v="-15">−15 s</button><button class="btn primary" id="chronoMain" data-act="tToggle" style="min-width:150px">${ic('play')} Démarrer</button><button class="btn" data-act="tNudge" data-v="15">+15 s</button></div>
        <div class="presets">${[60, 90, 120, 150, 180, 240].map((s) => `<button class="chip" aria-pressed="${T.dur === s}" data-act="tPreset" data-v="${s}">${clock(s)}</button>`).join('')}</div>

    updateTimerUI();
  }

  async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); toast(okMsg); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove(); toast(ok ? okMsg : 'Copie impossible ici : sélectionne le texte à la main.');
    }
  }

  /* ===================== Séance : déroulé linéaire ===================== */
  const EQUIP_STEP = { barre: 2.5, smith: 2.5, halteres: 2, machine: 2.5, poulie: 2.5 };
  const loadStep = (ex) => EQUIP_STEP[(ex && ex.equip) || 'machine'] || 2.5;
  const roundLoad = (w, ex) => { const st = loadStep(ex); return Math.max(0, Math.round(w / st) * st); };

    const ws = last.entry.sets.flatMap(setDoneParts).map((x) => num(x.w)).filter((v) => v != null && v > 0);
    return ws.length ? Math.max(...ws) : null;

  function targetWeight(ex) {

  /* Chauffe : vide × 10 → 50 % × 8 → 70 % × 4 → 85 % × 2 sur un polyarticulaire froid ; moins si le muscle est déjà chaud. */
  function warmupsFor(ex, tw, warmed) {

    const comp = !!ex.compound;
    if (warmed && !comp) return [];
    if (!tw) return comp ? (warmed ? [{ w: null, r: 6, pct: 0.6 }] : [{ w: null, r: 10, pct: 0.4 }, { w: null, r: 5, pct: 0.7 }]) : [{ w: null, r: 12, pct: 0.5 }];
    const plan = comp ? (warmed ? [[0.6, 6]] : [[0, 10], [0.5, 8], [0.7, 4], [0.85, 2]]) : [[0.5, 12]];

  function uniGap(entry) {

  const stepKey = (st) => (st.k === 'end' ? 'end' : `${st.k}:${st.ei}:${st.k === 'warm' ? st.wi : st.si}:${st.side || ''}`);

      if (w > 0) next[e.exId] = { w: nw, r: nr, from: w };
      if (avgRir != null && avgRir >= 3.5) axes.push({ p: 2, txt: `Au ${lc(e.name)}, tu as fini loin de l'échec (RIR moyen ${fmt(avgRir, 1)}) : rapproche-toi de 1 à 3 reps en réserve.`, src: ['refalo2023', 'zourdos2016'] });
    });
    gaps.filter((x) => x.g.pct >= 10).forEach((x) => axes.push({ p: 1, txt: `Écart gauche / droite de ${fmt(x.g.pct, 0)} % au ${lc(x.e.name)} : commence par le côté ${SIDE_LABEL[x.g.weak]} (le plus faible) et aligne les reps de l'autre côté dessus.`, src: ['bishop2018', 'delavier2'] }));
    regs.filter((x) => x.drop > 0.35).forEach((x) => axes.push({ p: 3, txt: `Gros écart de reps entre tes séries au ${lc(x.e.name)} : prends ton repos complet ou baisse légèrement la charge.`, src: ['schoenfeld2016'] }));
    if (rests.length >= 4 && okR / rests.length < 0.6) axes.push({ p: 2, txt: 'Respecte mieux tes repos, surtout les 3 min sur les gros mouvements : la force de la série suivante en dépend.', src: ['schoenfeld2016', 'singer2024'] });
    const missed = wpl.filter((e) => e.warmDone < e.warmPlanned);
    if (missed.length) axes.push({ p: 1, txt: `Fais toutes tes séries de chauffe avant ${missed.slice(0, 2).map((e) => lc(e.name)).join(' et ')}.`, src: ['mccrary2015'] });
    axes.sort((a, b) => a.p - b.p);

  }

  /* ===================== Quiz ===================== */
  function pickQuiz(log, n) {
    const exIds = new Set(log.entries.map((e) => e.exId));
    const qz = S.core.quiz || { box: {}, wrong: {} };
    return QUIZ.map((q) => {
      const box = qz.box[q.id] != null ? qz.box[q.id] : -1; const wrong = qz.wrong[q.id] || 0;
      let pr = Math.random() * 10;
      if (box === 0 && wrong) pr += 100;
      if (q.ex.some((x) => exIds.has(x))) pr += 40;
      if (box === -1) pr += 25;
      pr -= Math.max(0, box) * 15;
      return { id: q.id, pr };
    }).sort((a, b) => b.pr - a.pr).slice(0, n).map((x) => x.id);
  }

  /* ===================== Actions des nouveautés ===================== */
  Object.assign(ACT, {
    stepDone: () => {
      const cs = curStep(); if (!cs || cs.st.k === 'end') return;
      const { act, steps, i, st, e, ex, data } = cs;
      const was = data.done;
      if (e.type === 'time') {
        if (data.t == null && ex.minutes) data.t = `${ex.minutes}:00`;
        if (data.d == null && ex.minutes && ex.speed) data.d = Math.round((ex.speed * 1000 * ex.minutes) / 60);
      } else {
        if (data.r == null && st.k !== 'warm') data.r = e.tr || repsMin(e.treps);
        if (st.k === 'set' && e.type === 'wr' && data.w == null) data.w = e.tw;
      }
      data.done = true;
      if (!was) data.at = Date.now();
      if (e.uni && st.k === 'set') { const s = e.sets[st.si]; s.done = !!(s.L.done && s.R.done); }
      const nx = steps[i + 1]; act.at = stepKey(nx);
      if (was) { persist(['core']); render(); toast('Série mise à jour'); return; }
      const rest = restAfter(act, steps, i);
      if (rest > 0 && S.core.settings.autoRest) { act.rest = { dur: rest, t0: Date.now() }; startTimer(rest); }
      persist(['core']); render(); window.scrollTo(0, 0);
    },
    stepBack: () => {
      const cs = curStep(); if (!cs) return;
      if (cs.act.rest) { cs.act.rest = null; if (T.state !== 'idle') resetTimer(); }
      if (cs.i > 0) cs.act.at = stepKey(cs.steps[cs.i - 1]);
      persist(['core']); render(); window.scrollTo(0, 0);
    },
    stepJump: (el) => { const act = S.core.active; if (!act) return; act.rest = null; if (T.state !== 'idle') resetTimer(); act.at = el.dataset.key; persist(['core']); closeSheet(); render(); window.scrollTo(0, 0); },
    stepInc: (el) => {
      const cs = curStep(); if (!cs || !cs.data) return; const f = el.dataset.f;
      const inp = $(`#sv-${f}`); const base = num(cs.data[f]) != null ? num(cs.data[f]) : num(inp && inp.placeholder) || 0;
      const v = Math.max(0, Math.round((base + (+el.dataset.v)) * 100) / 100);
      cs.data[f] = v; if (inp) inp.value = String(v).replace('.', ',');
      persist(['core'], 400);
    },
    stepRir: (el) => { const cs = curStep(); if (!cs || !cs.data) return; const v = +el.dataset.v; cs.data.rir = cs.data.rir === v ? null : v; persist(['core'], 400); $$('.rir button').forEach((b) => b.setAttribute('aria-pressed', String(+b.dataset.v === cs.data.rir))); },
    stepAddSet: () => {
      const cs = curStep(); if (!cs || !cs.e) return; const e = cs.e; const lastW = e.tw;
      const mkS = () => ({ w: lastW, r: null, rir: null, done: false });
      e.sets.push(e.uni ? { L: mkS(), R: mkS(), done: false } : Object.assign(mkS(), { t: null, d: null }));

    stepSkipEx: () => {

      const steps = buildSteps(cs.act); const nx = steps.find((s, k) => k > 0 && (s.k === 'end' || s.ei > cs.st.ei));

    restSkip: () => endRest(),
    sessionMenu: () => { UI.confirm = null; sessionMenuSheet(); },

    quizStart: (el) => { const log = allLogs().find((l) => l.id === el.dataset.id); if (!log) return; UI.quiz = { logId: log.id, ids: pickQuiz(log, 4), i: 0, pick: null, good: 0, missed: [] }; UI.view = 'quiz'; render(); window.scrollTo(0, 0); },
    quizPick: (el) => {

    },
    quizClose: () => { const id = UI.quiz && UI.quiz.logId; UI.quiz = null; UI.view = id ? 'report' : null; UI.reportId = id; render(); window.scrollTo(0, 0); },
    mealManual: (el) => { UI.mealDraft = { date: el.dataset.date, name: '', slot: guessSlot(), items: [], src: 'manuel' }; mealSheet(); },
    mealEdit: (el) => { const j = journal(el.dataset.date); const m = (j.meals || []).find((x) => x.id === el.dataset.id); if (!m) return; UI.mealDraft = Object.assign(clone(m), { date: el.dataset.date }); mealSheet(); },
    mealDel: (el) => { const j = journal(el.dataset.date, true); j.meals = (j.meals || []).filter((m) => m.id !== el.dataset.id); persist([mk(el.dataset.date)]); if (UI.sheet) closeSheet(); render(); toast('Repas supprimé'); },
    miDel: (el) => { UI.mealDraft.items.splice(+el.dataset.i, 1); mealSheet(); },
    miAdd: (el) => { UI.mealDraft.items.push(itemFromFood(el.dataset.fid)); mealSheet(); },
    mealSave: () => {
      const md = UI.mealDraft; if (!md.items.length) { toast('Ajoute au moins un aliment'); return; }
      const j = journal(md.date, true); j.meals = j.meals || [];
      const meal = { id: md.id || uid(), name: md.name || (md.items.map((i) => i.n).slice(0, 2).join(', ')), slot: md.slot, src: md.src || 'manuel', at: md.at || Date.now(), items: md.items.map((i) => ({ n: i.n, g: num(i.g) || 0, k100: i.k100, p100: i.p100, c100: i.c100, f100: i.f100, conf: i.conf || null, fid: i.fid || null })) };
      const k = j.meals.findIndex((m) => m.id === meal.id); if (k >= 0) j.meals[k] = meal; else j.meals.push(meal);
      persist([mk(md.date)]); closeSheet(); UI.mealsDate = md.date; render(); toast(`Repas enregistré : ${fmtInt(mealM(meal).kcal)} kcal`);
    },
    dishSave: () => {
      const md = UI.mealDraft; if (!md.items.length) { toast('Ajoute au moins un aliment'); return; }
      const name = (md.name || '').trim() || md.items.map((i) => i.n).slice(0, 2).join(', ');
      S.core.homeDishes = S.core.homeDishes || {};
      const id = md.dishId || 'h-' + uid();
      S.core.homeDishes[id] = { n: name, items: md.items.map((i) => ({ n: i.n, g: num(i.g) || 0, k100: i.k100, p100: i.p100, c100: i.c100, f100: i.f100, fid: i.fid || null })) };
      persist(['core']);
      if (md.asDish) ACT.mealDishes({ dataset: { date: md.date } });
      toast(`« ${name} » enregistré dans tes recettes`);
    },
    mealDishes: (el) => {
      const dishes = S.core.homeDishes || {}; const ids = Object.keys(dishes); const date = el.dataset.date;
      openSheet('dishes', `${sheetHead('Mes recettes')}
        <button class="btn primary block" data-act="dishNew" data-date="${date}">${ic('plus')} Créer une recette</button>
        ${ids.length ? `<div class="list">${ids.map((id) => { const dd = dishes[id]; const m = mealM(dd); return `<div class="li"><button class="grow" style="all:unset;cursor:pointer;flex:1;min-width:0" data-act="dishUse" data-id="${id}" data-date="${date}"><div class="t">${esc(dd.n)}</div><div class="s">${fmtInt(m.kcal)} kcal · P ${fmtInt(m.p)} g · touche pour l'ajouter à ta journée</div></button><button class="icon-btn" data-act="dishEdit" data-id="${id}" data-date="${date}" aria-label="Modifier">${ic('edit')}</button></div>`; }).join('')}</div>` : '<div class="empty">Aucune recette pour l\'instant. Crée celles que tu manges souvent chez tes parents (hachis, gratin, couscous…) : elles seront à un clic ensuite.</div>'}`);
    },
    dishNew: (el) => { UI.mealDraft = { date: el.dataset.date, name: '', slot: guessSlot(), items: [], src: 'plat', asDish: true }; mealSheet(); },
    dishEdit: (el) => { const dd = (S.core.homeDishes || {})[el.dataset.id]; if (!dd) return; UI.mealDraft = { date: el.dataset.date, name: dd.n, slot: guessSlot(), items: clone(dd.items), src: 'plat', asDish: true, dishId: el.dataset.id }; mealSheet(); },
    dishUse: (el) => { const dd = (S.core.homeDishes || {})[el.dataset.id]; if (!dd) return; UI.mealDraft = { date: el.dataset.date, name: dd.n, slot: guessSlot(), items: clone(dd.items), src: 'plat' }; mealSheet(); },
    dishDel: (el) => { delete S.core.homeDishes[el.dataset.id]; persist(['core']); ACT.mealDishes(el); },

  });
  Object.assign(IN, {
    stepVal: (el) => { const cs = curStep(); if (!cs || !cs.data) return; const f = el.dataset.f; cs.data[f] = f === 't' ? (el.value.trim() || null) : num(el.value); persist(['core'], 500); },
    mdName: (el) => { UI.mealDraft.name = el.value; },
    miName: (el) => { UI.mealDraft.items[+el.dataset.i].n = el.value; },
    miG: (el) => { UI.mealDraft.items[+el.dataset.i].g = num(el.value) || 0; updateMealTotals(); },
    miSearch: (el) => {
      const q = el.value.trim(); const box = $('#miResults'); if (!box) return;
      if (q.length < 2) { box.innerHTML = ''; return; }
      const n = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      const hits = Object.keys(FOODS).filter((fid) => n(FOODS[fid].n).includes(n(q))).slice(0, 8);
      box.innerHTML = hits.map((fid) => `<button class="li" style="all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)" data-act="miAdd" data-fid="${fid}"><div class="grow"><div class="t">${esc(FOODS[fid].n)}</div><div class="s">pour 100 g : ${FOODS[fid].kcal} kcal · P ${fmt(FOODS[fid].p, 1)} g</div></div>${ic('plus')}</button>`).join('') || '<p class="muted small">Pas trouvé : ajoute un aliment proche, puis renomme-le et ajuste les grammes.</p>';
    },
  });
  Object.assign(CH, {
    mdSlot: (el) => { UI.mealDraft.slot = el.value; },

  });
  function uniGapLine(exId) {
    const gs = exHistory(exId).map((h) => uniGap(h.entry)).filter(Boolean).slice(-5);
    if (!gs.length) return '';
    const avg = gs.reduce((a, g) => a + g.pct, 0) / gs.length;
    const weak = gs.filter((g) => g.weak === 'L').length >= gs.length / 2 ? 'L' : 'R';
    return `<div class="card flat small"><b>Écart gauche / droite</b> : ${fmt(avg, 0)} % en moyenne sur ${gs.length} séance${gs.length > 1 ? 's' : ''}, côté ${SIDE_LABEL[weak]} plus faible.${avg >= 10 ? ' Commence par ce côté et aligne l\'autre dessus.' : ' Écart faible, rien à corriger.'} ${srcChips(['bishop2018'])}</div>`;
  }

  /* ===================== Démarrage ===================== */
  applyTheme();
  render();
  setInterval(tick, 250);
  initRemote();
})();

</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body></html>
